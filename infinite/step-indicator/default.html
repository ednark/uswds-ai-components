<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="USWDS Step Indicator for showing progress through multi-step processes.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USWDS Step Indicator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<script type="application/json" id="uswds-agent-meta">
{
  "_schemaVersion": 2,
  "discovery": {
    "uswdsComponentType": "step-indicator",
    "uswdsClass": "usa-step-indicator",
    "section": "navigation",
    "variant": "default",
    "requiresJs": "required",
    "interaction": [
      "click",
      "focus",
      "keyboard"
    ],
    "a11y": {
      "wcag21AA": true,
      "keyboardNav": true,
      "screenReader": true,
      "reducedMotion": true,
      "forcedColors": true,
      "ariaAttributes": true
    },
    "govCompliance": [
      "Section 508",
      "WCAG 2.1 AA",
      "21st Century IDEA"
    ],
    "tier": "curated",
    "tags": [
      "step",
      "indicator",
      "progress",
      "wizard",
      "multi-step",
      "form",
      "phases",
      "checkout"
    ],
    "description": "Shows users their progress through a multi-step process with numbered steps.",
    "compliance": {
      "nistControls": [],
      "fedRampLevel": "IL2+",
      "section508": true,
      "wcag21AA": true,
      "piiHandling": "displays_only",
      "auditTrailCompatible": false,
      "dataMaskingCompatible": false
    },
    "mobileUX": {
      "touchTargetSize": "44px",
      "requiredMinSpacing": "8px",
      "orientationLocked": false,
      "fullscreenSafe": true
    },
    "supportedTokenProfiles": [
      "highContrast"
    ]
  },
  "selection": {
    "useWhen": [
      "Multi-step forms or wizards",
      "Processes with distinct phases",
      "Onboarding or application workflows",
      "Checkout or registration flows"
    ],
    "avoidWhen": [
      "Single-step processes",
      "Parallel workflows without sequence",
      "Content-heavy interfaces where step indicator would clutter"
    ]
  },
  "instruction": {
    "agentPrompt": "Add usa-step-indicator--centered for centered variant, usa-step-indicator--no-labels for labels-hidden variant. Update step labels and aria-current='step' on current step. Steps must be in order.",
    "relatedComponents": [
      "process-list",
      "pagination",
      "breadcrumb"
    ],
    "variants": [
      "default",
      "centered",
      "no-labels"
    ],
    "settings": [
      "$theme-step-indicator-border-radius"
    ],
    "tokenOverrides": [
      "$theme-step-indicator-border-color",
      "$theme-step-indicator-current-color"
    ]
  },
  "constraints": {
    "preserve": [
      "ol.usa-step-indicator__segments",
      "li.usa-step-indicator__segment for each step",
      "span.usa-step-indicator__segment-label for labels",
      "aria-current='step' on current step",
      "Segment number is CSS-generated"
    ],
    "editable": [
      "Step numbers and labels",
      "Step descriptions",
      "Current step: aria-current='step' attribute",
      "Completed vs incomplete styling",
      "Variant: centered or no-labels"
    ],
    "limitations": [
      "JavaScript required to update current step state",
      "Segments must be in DOM order",
      "Segment counters are CSS-based"
    ]
  },
  "file": "step-indicator/default.html",
  "title": "Step Indicator",
  "coordination": {
    "prerequisiteComponents": [],
    "incompatibleWith": [],
    "compositionCost": {
      "costTier": "moderate",
      "estimatedTokens": 1249,
      "renderingTimeMs": 60,
      "recommendedModel": "haiku"
    },
    "agentPromptSequence": [
      "1. Place above multi-step form sections",
      "2. Mark completed/current steps with status classes; keep aria attributes",
      "3. Pair each step with its own form section or page"
    ]
  }
}
</script>
<style>
  body {
    font-family: 'Source Sans 3', 'Source Sans Pro', -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0;
    padding: 2rem;
    background: #f5f5f5;
    color: #1b1b1b;
    line-height: 1.5;
  }
  .cap {
    position: fixed;
    bottom: 12px;
    left: 16px;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: #717171;
    text-transform: uppercase;
    font-weight: 400;
  }
</style>
</head>
<body>
<nav class="usa-step-indicator" aria-label="Progress">
  <ol class="usa-step-indicator__segments">
    <li class="usa-step-indicator__segment usa-step-indicator__segment--complete">
      <span class="usa-step-indicator__segment-label">Step 1 <span class="usa-sr-only">completed</span></span>
    </li>
    <li class="usa-step-indicator__segment usa-step-indicator__segment--complete">
      <span class="usa-step-indicator__segment-label">Step 2 <span class="usa-sr-only">completed</span></span>
    </li>
    <li class="usa-step-indicator__segment usa-step-indicator__segment--current" aria-current="true">
      <span class="usa-step-indicator__segment-label">Step 3 <span class="usa-sr-only">current step</span></span>
    </li>
    <li class="usa-step-indicator__segment">
      <span class="usa-step-indicator__segment-label">Step 4</span>
    </li>
  </ol>
</nav>
<div class="cap">Step Indicator default</div>
</body>
</html>
