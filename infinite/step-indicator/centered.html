<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="USWDS Step indicator centered variant.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USWDS Step Indicator (Centered)</title>
<script type="application/json" id="uswds-agent-meta">
{
  "file": "step-indicator/centered.html",
  "title": "Step Indicator (Centered)",
  "uswdsComponentType": "step-indicator",
  "uswdsClass": "usa-step-indicator--centered",
  "description": "Step indicator with centered labels.",
  "section": "navigation",
  "variant": "centered",
  "useWhen": ["Multi-step forms", "Wizard flows", "Process documentation"],
  "avoidWhen": ["Simple 2-step processes", "Mobile with limited space"],
  "agentPrompt": "Add usa-step-indicator--centered class to usa-step-indicator.",
  "editableAreas": ["Step labels", "Current/completed states", "Step numbers"],
  "preserveElements": ["ol.usa-step-indicator", "li.usa-step-indicator__segment", "span.usa-step-indicator__label"],
  "knownLimitations": ["JavaScript needed for state updates", "Many steps may require scroll"],
  "tier": "curated",
  "requiresJs": "required",
  "interaction": ["click"],
  "a11y": {"wcag21AA": true, "keyboardNav": true, "screenReader": true, "reducedMotion": true, "forcedColors": true, "ariaAttributes": true},
  "govCompliance": ["Section 508", "WCAG 2.1 AA", "21st Century IDEA"],
  "variants": ["default", "centered", "no-labels"],
  "settings": ["$theme-step-indicator-counter-gap"],
  "relatedComponents": ["process-list", "button-group"],
  "tokenOverrides": ["$theme-step-indicator-counter-gap"],
  "tags": ["step-indicator", "centered", "wizard", "multistep"]
}
</script>
</head>
<body>
<ol class="usa-step-indicator usa-step-indicator--centered" aria-label="Progress">
  <li class="usa-step-indicator__segment usa-step-indicator__segment--complete">
    <span class="usa-step-indicator__label">Step 1 <span class="usa-sr-only">completed</span></span>
  </li>
  <li class="usa-step-indicator__segment usa-step-indicator__segment--complete">
    <span class="usa-step-indicator__label">Step 2 <span class="usa-sr-only">completed</span></span>
  </li>
  <li class="usa-step-indicator__segment usa-step-indicator__segment--current">
    <span class="usa-step-indicator__label">Step 3 <span class="usa-sr-only">current</span></span>
  </li>
  <li class="usa-step-indicator__segment">
    <span class="usa-step-indicator__label">Step 4</span>
  </li>
</ol>
</body>
</html>
