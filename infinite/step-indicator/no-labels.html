<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="USWDS Step indicator no-labels variant.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USWDS Step Indicator (No Labels)</title>
<script type="application/json" id="uswds-agent-meta">
{
  "file": "step-indicator/no-labels.html",
  "title": "Step Indicator (No Labels)",
  "uswdsComponentType": "step-indicator",
  "uswdsClass": "usa-step-indicator--no-labels",
  "description": "Step indicator showing only visual steps without text labels.",
  "section": "navigation",
  "variant": "no-labels",
  "useWhen": ["Compact spaces", "When step names are shown elsewhere", "Minimal UI approach"],
  "avoidWhen": ["Users need to understand what each step means", "Accessibility is critical"],
  "agentPrompt": "Add usa-step-indicator--no-labels class to usa-step-indicator. Segments only, no text.",
  "editableAreas": ["Step visual states only"],
  "preserveElements": ["ol.usa-step-indicator", "li.usa-step-indicator__segment"],
  "knownLimitations": ["Less accessible - users can't understand steps without labels"],
  "tier": "curated",
  "requiresJs": "required",
  "interaction": ["click"],
  "a11y": {"wcag21AA": true, "keyboardNav": true, "screenReader": false, "reducedMotion": true, "forcedColors": true, "ariaAttributes": true},
  "govCompliance": ["Section 508", "WCAG 2.1 AA", "21st Century IDEA"],
  "variants": ["default", "centered", "no-labels"],
  "settings": ["$theme-step-indicator-counter-gap"],
  "relatedComponents": ["process-list", "button-group"],
  "tokenOverrides": ["$theme-step-indicator-counter-gap"],
  "tags": ["step-indicator", "no-labels", "minimal", "compact"]
}
</script>
</head>
<body>
<ol class="usa-step-indicator usa-step-indicator--no-labels" aria-label="Progress">
  <li class="usa-step-indicator__segment usa-step-indicator__segment--complete"></li>
  <li class="usa-step-indicator__segment usa-step-indicator__segment--complete"></li>
  <li class="usa-step-indicator__segment usa-step-indicator__segment--current"></li>
  <li class="usa-step-indicator__segment"></li>
</ol>
</body>
</html>
