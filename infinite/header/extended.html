<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="USWDS Header extended variant with full-width navigation.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USWDS Header (Extended)</title>
<script type="application/json" id="uswds-agent-meta">
{
  "file": "header/extended.html",
  "title": "Header (Extended)",
  "uswdsComponentType": "header",
  "uswdsClass": "usa-header usa-header--extended",
  "description": "Header with extended navigation, full-width links always visible on desktop.",
  "section": "navigation",
  "variant": "extended",
  "useWhen": ["Sites with multiple main sections", "Desktop-focused navigation", "Full nav visibility required"],
  "avoidWhen": ["Mobile-first designs", "Simple sites needing minimal nav"],
  "agentPrompt": "Add usa-header--extended class to usa-header. Full nav always visible on desktop.",
  "editableAreas": ["Agency logo and name", "Extended nav links", "Search if needed"],
  "preserveElements": ["header.usa-header usa-header--extended", "div.usa-logo", "nav.usa-nav"],
  "knownLimitations": ["Nav always visible (doesn't collapse to hamburger on desktop)"],
  "tier": "curated",
  "requiresJs": "required",
  "interaction": ["click", "hover", "focus"],
  "a11y": {"wcag21AA": true, "keyboardNav": true, "screenReader": true, "reducedMotion": true, "forcedColors": true, "ariaAttributes": true},
  "govCompliance": ["Section 508", "WCAG 2.1 AA", "21st Century IDEA"],
  "variants": ["default", "basic", "extended", "megamenu"],
  "settings": ["$theme-header-font-family", "$theme-header-logo-width"],
  "relatedComponents": ["side-navigation", "footer", "search"],
  "tokenOverrides": ["$theme-header-font-family", "$theme-header-logo-width", "$theme-header-min-width"],
  "tags": ["header", "extended", "full-width", "desktop"]
}
</script>
</head>
<body>
<a class="usa-skipnav" href="#main-content">Skip to main content</a>
<header class="usa-header usa-header--extended" id="header">
  <div class="usa-nav-container">
    <div class="usa-logo">
      <em class="usa-logo__text">Agency Name</em>
    </div>
    <button class="usa-menu-btn">Menu</button>
    <nav class="usa-nav" aria-label="Main navigation">
      <ul class="usa-list--unstyled usa-nav__primary">
        <li class="usa-nav__primary-item">
          <a class="usa-nav__link" href="#">Section One</a>
        </li>
        <li class="usa-nav__primary-item">
          <a class="usa-nav__link" href="#">Section Two</a>
        </li>
        <li class="usa-nav__primary-item">
          <a class="usa-nav__link" href="#">Section Three</a>
        </li>
      </ul>
    </nav>
  </div>
</header>
<main id="main-content">
  <p>Main content area</p>
</main>
</body>
</html>
