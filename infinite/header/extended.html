<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="USWDS Header extended variant with full-width navigation.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USWDS Header (Extended)</title>
<script type="application/json" id="uswds-agent-meta">{

  "discovery": {
    "uswdsComponentType": "header",
    "uswdsClass": "usa-header usa-header--extended",
    "section": "navigation",
    "variant": "extended",
    "requiresJs": "required",
    "interaction": [
      "click",
      "hover",
      "focus"
    ],
    "a11y": {
      "wcag21AA": true,
      "keyboardNav": true,
      "screenReader": true,
      "reducedMotion": true,
      "forcedColors": true,
      "ariaAttributes": true
    },
    "govCompliance": [
      "Section 508",
      "WCAG 2.1 AA",
      "21st Century IDEA"
    ],
    "tier": "curated",
    "tags": [
      "header",
      "extended",
      "full-width",
      "desktop"
    ],
    "description": "Header with extended navigation, full-width links always visible on desktop.",
    "compliance": {
      "nistControls": [],
      "fedRampLevel": "IL2+",
      "section508": true,
      "wcag21AA": true,
      "piiHandling": "displays_only",
      "auditTrailCompatible": false,
      "dataMaskingCompatible": false
    },
    "mobileUX": {
      "touchTargetSize": "44px",
      "requiredMinSpacing": "8px",
      "orientationLocked": false,
      "fullscreenSafe": true
    },
    "supportedTokenProfiles": [
      "highContrast"
    ],
    "uswdClass": "usa-header"
  },
  "selection": {
    "useWhen": [
      "Sites with multiple main sections",
      "Desktop-focused navigation",
      "Full nav visibility required"
    ],
    "avoidWhen": [
      "Mobile-first designs",
      "Simple sites needing minimal nav"
    ]
  },
  "instruction": {
    "agentPrompt": "Add usa-header--extended class to usa-header. Full nav always visible on desktop.",
    "relatedComponents": [
      "side-navigation",
      "footer",
      "search"
    ],
    "variants": [
      "default",
      "basic",
      "extended",
      "megamenu"
    ],
    "settings": [
      "$theme-header-font-family",
      "$theme-header-logo-width"
    ],
    "tokenOverrides": [
      "$theme-header-font-family",
      "$theme-header-logo-width",
      "$theme-header-min-width"
    ]
  },
  "constraints": {
    "preserve": [
      "header.usa-header.usa-header--extended",
      "div.usa-navbar with div.usa-logo and button.usa-menu-btn",
      "nav.usa-nav > div.usa-nav__inner",
      "button.usa-nav__close",
      "ul.usa-nav__primary.usa-accordion with li.usa-nav__primary-item > a.usa-nav__link"
    ],
    "editable": [
      "Agency logo and name",
      "Extended nav links",
      "Search if needed"
    ],
    "limitations": [
      "Nav always visible (doesn't collapse to hamburger on desktop)",
      "Mobile menu open/close (is-visible class), focus management and the usa-js-mobile-nav--active body class come from USWDS usa-header.js",
      "The extended header has no usa-nav-container wrapper (that wrapper belongs to the basic variant)"
    ]
  },
  "file": "header/extended.html",
  "title": "Header (Extended)",
  "coordination": {
    "prerequisiteComponents": [],
    "incompatibleWith": [
      {
        "name": "modal",
        "reason": "Header already establishes page chrome; nested modals in header break focus order"
      }
    ],
    "compositionCost": {
      "costTier": "moderate",
      "estimatedTokens": 959,
      "renderingTimeMs": 60,
      "recommendedModel": "haiku"
    },
    "agentPromptSequence": [
      "1. Place header as the first element in body",
      "2. Nest navigation (primary, secondary) inside header",
      "3. Pair with banner above it when a required-agency banner is needed"
    ],
    "compositionRecipes": [
      "navigation-hierarchy"
    ]
  }

</head>
<body>
<a class="usa-skipnav" href="#main-content">Skip to main content</a>
<div class="usa-overlay"></div>
<header class="usa-header usa-header--extended" id="header">
  <div class="usa-navbar">
    <div class="usa-logo">
      <em class="usa-logo__text">
        <a href="/" title="Home">Agency Name</a>
      </em>
    </div>
    <button type="button" class="usa-menu-btn">Menu</button>
  </div>
  <nav class="usa-nav" aria-label="Main navigation">
    <div class="usa-nav__inner">
      <button type="button" class="usa-nav__close">
        <img src="/assets/img/usa-icons/close.svg" role="img" alt="Close">
      </button>
      <ul class="usa-nav__primary usa-accordion">
        <li class="usa-nav__primary-item">
          <a class="usa-nav__link" href="#"><span>Section One</span></a>
        </li>
        <li class="usa-nav__primary-item">
          <a class="usa-nav__link" href="#"><span>Section Two</span></a>
        </li>
        <li class="usa-nav__primary-item">
          <a class="usa-nav__link" href="#"><span>Section Three</span></a>
        </li>
      </ul>
    </div>
  </nav>
</header>
<main id="main-content">
  <p>Main content area</p>
</main>
</body>
</html>
