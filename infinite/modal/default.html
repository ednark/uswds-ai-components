<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="USWDS Modal component for focused single-task interactions.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USWDS Modal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<script type="application/json" id="uswds-agent-meta">
{
  "file": "modal/default.html",
  "title": "Modal",
  "uswdsComponentType": "modal",
  "uswdsClass": "usa-modal",
  "description": "Disables page content and focuses user's attention on a single task or message.",
  "section": "feedback",
  "variant": "default",
  "useWhen": [
    "Critical confirmations before destructive actions",
    "Focused tasks that shouldn't be interrupted",
    "Important alerts requiring immediate attention",
    "Quick data entry or editing"
  ],
  "avoidWhen": [
    "Non-critical information that doesn't need focus",
    "Complex multi-step workflows (use page flow instead)",
    "Content users need to reference while working elsewhere",
    "Mobile interfaces where modals are disruptive"
  ],
  "agentPrompt": "Add usa-modal--lg for larger modal. Update modal heading and body content. Add aria-labelledby and aria-describedby to link to heading and body content. Add close button with usa-modal__close class.",
  "editableAreas": [
    "Modal heading text",
    "Modal body content",
    "Action buttons in footer",
    "Close button text",
    "Size variant: default or usa-modal--lg"
  ],
  "preserveElements": [
    "div.usa-modal-wrapper for overlay",
    "div.usa-modal for the dialog",
    "h2.usa-modal__heading for title",
    "div.usa-modal__content for body",
    "div.usa-modal__footer for actions",
    "button.usa-modal__close for dismiss",
    "aria-labelledby and aria-describedby"
  ],
  "knownLimitations": [
    "JavaScript required for open/close behavior",
    "Focus is trapped within modal when open",
    "Body scroll is locked when modal is open",
    "Must provide aria-label or aria-labelledby"
  ],
  "tier": "curated",
  "requiresJs": "required",
  "interaction": ["click", "keyboard", "focus"],
  "a11y": {"wcag21AA": true, "keyboardNav": true, "screenReader": true, "reducedMotion": true, "forcedColors": true, "ariaAttributes": true},
  "govCompliance": ["Section 508", "WCAG 2.1 AA", "21st Century IDEA"],
  "variants": ["default", "lg"],
  "settings": ["$theme-modal-border-radius"],
  "relatedComponents": ["alert", "tooltip", "banner"],
  "tokenOverrides": ["$theme-modal-border-radius", "$theme-modal-lg-max-width"],
  "tags": ["modal", "dialog", "popup", "overlay", "confirm", "focus", "alert"]
}
</script>
<style>
  body {
    font-family: 'Source Sans 3', 'Source Sans Pro', -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0;
    padding: 2rem;
    background: #f5f5f5;
    color: #1b1b1b;
    line-height: 1.5;
  }
  .cap {
    position: fixed;
    bottom: 12px;
    left: 16px;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: #717171;
    text-transform: uppercase;
    font-weight: 400;
  }
</style>
</head>
<body>
<div class="usa-modal-wrapper">
  <div class="usa-modal usa-modal--lg" id="example-modal" aria-labelledby="modal-heading">
    <div class="usa-modal__content">
      <div class="usa-modal__header">
        <h2 class="usa-modal__heading" id="modal-heading">Confirm Action</h2>
        <button class="usa-modal__close" aria-label="Close">Close</button>
      </div>
      <div class="usa-modal__body">
        <p>Are you sure you want to proceed? This action cannot be undone.</p>
      </div>
      <div class="usa-modal__footer">
        <button class="usa-button" type="button">Confirm</button>
        <button class="usa-button usa-button--unstyled" type="button">Cancel</button>
      </div>
    </div>
  </div>
</div>
<div class="cap">Modal default</div>
</body>
</html>
