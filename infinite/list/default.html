<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="USWDS List component for organizing information into sequential sections.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USWDS List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<script type="application/json" id="uswds-agent-meta">{
  "_schemaVersion": 2,
  "discovery": {
    "uswdsComponentType": "list",
    "uswdsClass": "usa-list",
    "section": "layout",
    "variant": "default",
    "requiresJs": "no",
    "interaction": [
      "passive"
    ],
    "a11y": {
      "wcag21AA": true,
      "keyboardNav": false,
      "screenReader": true,
      "reducedMotion": true,
      "forcedColors": true,
      "ariaAttributes": false
    },
    "govCompliance": [
      "Section 508",
      "WCAG 2.1 AA",
      "21st Century IDEA"
    ],
    "tier": "curated",
    "tags": [
      "list",
      "ul",
      "ol",
      "li",
      "bullet",
      "numbered",
      "items"
    ],
    "description": "Organizes information into discrete sequential sections.",
    "compliance": {
      "nistControls": [],
      "fedRampLevel": "IL2+",
      "section508": true,
      "wcag21AA": true,
      "piiHandling": "displays_only",
      "auditTrailCompatible": false,
      "dataMaskingCompatible": false
    },
    "mobileUX": {
      "touchTargetSize": "44px",
      "requiredMinSpacing": "8px",
      "orientationLocked": false,
      "fullscreenSafe": true
    },
    "supportedTokenProfiles": [
      "highContrast"
    ],
    "uswdClass": "usa-list"
  },
  "selection": {
    "useWhen": [
      "Presenting groups of related items",
      "Step-by-step instructions",
      "Enumerated content that needs to be scannable",
      "Navigation menus"
    ],
    "avoidWhen": [
      "Paragraph text that flows continuously",
      "Densely packed tables of data",
      "One-off items without grouping"
    ]
  },
  "instruction": {
    "agentPrompt": "Use ol.usa-list for ordered (numbered) lists, ul.usa-list for unordered (bulleted). Use usa-list--unstyled to remove default bullets. Use usa-list--bordered for visual separation between items.",
    "relatedComponents": [
      "prose",
      "icon-list"
    ],
    "variants": [
      "ul",
      "ol",
      "li"
    ],
    "settings": [
      "$theme-list-font-family"
    ],
    "tokenOverrides": [
      "$theme-list-font-family"
    ]
  },
  "constraints": {
    "preserve": [
      "ol.usa-list or ul.usa-list wrapper",
      "li.usa-list__item for each item",
      "Semantic list structure for screen readers",
      "Proper nesting of lists"
    ],
    "editable": [
      "List item text content",
      "ol vs ul element choice",
      "usa-list--unstyled to remove bullets",
      "usa-list--bordered for bordered items",
      "List item nesting depth"
    ],
    "limitations": [
      "List resets should be used if mixing with custom content",
      "过度 nesting makes content hard to read",
      "Lists inside prose content have special spacing"
    ]
  },
  "file": "list/default.html",
  "title": "List",
  "coordination": {
    "prerequisiteComponents": [],
    "incompatibleWith": [],
    "compositionCost": {
      "costTier": "moderate",
      "estimatedTokens": 1126,
      "renderingTimeMs": 15,
      "recommendedModel": "haiku"
    },
    "agentPromptSequence": [
      "1. Keep semantic ul/ol structure",
      "2. For check/cross lists keep the icon spans aria-hidden"
    ]
  }
}</script>
<style>
  body {
    font-family: 'Source Sans 3', 'Source Sans Pro', -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0;
    padding: 2rem;
    background: #f5f5f5;
    color: #1b1b1b;
    line-height: 1.5;
  }
  .cap {
    position: fixed;
    bottom: 12px;
    left: 16px;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: #717171;
    text-transform: uppercase;
    font-weight: 400;
  }
  .list-demo {
    max-width: 400px;
    margin-bottom: 2rem;
  }
</style>
</head>
<body>
<div class="list-demo">
  <h3>Unordered List</h3>
  <ul class="usa-list">
    <li class="usa-list__item">First item</li>
    <li class="usa-list__item">Second item</li>
    <li class="usa-list__item">Third item</li>
  </ul>
</div>
<div class="list-demo">
  <h3>Ordered List</h3>
  <ol class="usa-list">
    <li class="usa-list__item">First step</li>
    <li class="usa-list__item">Second step</li>
    <li class="usa-list__item">Third step</li>
  </ol>
</div>
<div class="list-demo">
  <h3>Unstyled List</h3>
  <ul class="usa-list usa-list--unstyled">
    <li class="usa-list__item">No bullets</li>
    <li class="usa-list__item">Clean appearance</li>
    <li class="usa-list__item">Good for navigation</li>
  </ul>
</div>
<div class="cap">List default</div>
</body>
</html>
