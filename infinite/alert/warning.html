<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="USWDS Alert component - warning variant for cautionary messages.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USWDS Alert (Warning)</title>
<script type="application/json" id="uswds-agent-meta">
{
  "file": "alert/warning.html",
  "title": "Alert (Warning)",
  "uswdsComponentType": "alert",
  "uswdsClass": "usa-alert",
  "description": "Warning alert for situations that need user's attention and may need action.",
  "section": "feedback",
  "variant": "warning",
  "useWhen": ["Cautionary messages", "Time-sensitive warnings", "Potential issue notifications"],
  "avoidWhen": ["Critical errors", "Success confirmations", "Slim layouts"],
  "agentPrompt": "Use usa-alert--warning class for warning variant. Same structure as default.",
  "editableAreas": ["Alert text content", "Heading if present"],
  "preserveElements": ["usa-alert wrapper", "usa-alert--warning class", "usa-alert__body", "usa-alert__text"],
  "knownLimitations": ["Pure CSS - no JavaScript required"],
  "tier": "curated",
  "requiresJs": "no",
  "interaction": ["passive"],
  "a11y": {"wcag21AA": true, "keyboardNav": false, "screenReader": true, "reducedMotion": true, "forcedColors": true, "ariaAttributes": true},
  "govCompliance": ["Section 508", "WCAG 2.1 AA", "21st Century IDEA"],
  "variants": ["info", "success", "warning", "error", "slim"],
  "settings": ["$theme-alert-status-color"],
  "relatedComponents": ["site-alert", "banner", "validation"],
  "tokenOverrides": ["$theme-alert-status-color"],
  "tags": ["alert", "warning", "caution", "yellow"]
}
</script>
</head>
<body>
<div class="usa-alert usa-alert--warning">
  <div class="usa-alert__body">
    <p class="usa-alert__text"><strong>Warning:</strong> Your session will expire soon.</p>
  </div>
</div>
</body>
</html>
