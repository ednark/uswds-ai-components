<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="USWDS Alert component - success variant for confirming completed actions.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USWDS Alert (Success)</title>
<script type="application/json" id="uswds-agent-meta">
{
  "file": "alert/success.html",
  "title": "Alert (Success)",
  "uswdsComponentType": "alert",
  "uswdsClass": "usa-alert",
  "description": "Success alert for confirming completed actions or successful operations.",
  "section": "feedback",
  "variant": "success",
  "useWhen": ["Confirming successful form submission", "Success messages after completed actions", "Positive status updates"],
  "avoidWhen": ["Errors or warnings", "Informational messages", "Slim layouts"],
  "agentPrompt": "Use usa-alert--success class for success variant. Same structure as default.",
  "editableAreas": ["Alert text content", "Heading if present"],
  "preserveElements": ["usa-alert wrapper", "usa-alert--success class", "usa-alert__body", "usa-alert__text"],
  "knownLimitations": ["Pure CSS - no JavaScript required"],
  "tier": "curated",
  "requiresJs": "no",
  "interaction": ["passive"],
  "a11y": {"wcag21AA": true, "keyboardNav": false, "screenReader": true, "reducedMotion": true, "forcedColors": true, "ariaAttributes": true},
  "govCompliance": ["Section 508", "WCAG 2.1 AA", "21st Century IDEA"],
  "variants": ["info", "success", "warning", "error", "slim"],
  "settings": ["$theme-alert-status-color"],
  "relatedComponents": ["site-alert", "banner", "validation"],
  "tokenOverrides": ["$theme-alert-status-color"],
  "tags": ["alert", "success", "confirmation", "green"]
}
</script>
</head>
<body>
<div class="usa-alert usa-alert--success">
  <div class="usa-alert__body">
    <p class="usa-alert__text"><strong>Success:</strong> Your changes have been saved successfully.</p>
  </div>
</div>
</body>
</html>
