<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="USWDS Alert slim variant with reduced vertical height.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USWDS Alert (Slim)</title>
<script type="application/json" id="uswds-agent-meta">
{
  "file": "alert/slim.html",
  "title": "Alert (Slim)",
  "uswdsComponentType": "alert",
  "uswdsClass": "usa-alert",
  "description": "Slim alert variant with reduced vertical height for space-constrained interfaces.",
  "section": "feedback",
  "variant": "slim",
  "useWhen": ["Space-constrained layouts", "Multiple alerts stacking", "Subtle notifications"],
  "avoidWhen": ["Important messages needing emphasis", "Mobile interfaces where slim alerts might be missed"],
  "agentPrompt": "Add usa-alert--slim class. Use with any alert variant: usa-alert--info--slim, usa-alert--success--slim, etc.",
  "editableAreas": ["Alert text content"],
  "preserveElements": ["usa-alert wrapper", "usa-alert--slim class", "usa-alert__body", "usa-alert__text"],
  "knownLimitations": ["Reduced visual impact"],
  "tier": "curated",
  "requiresJs": "no",
  "interaction": ["passive"],
  "a11y": {"wcag21AA": true, "keyboardNav": false, "screenReader": true, "reducedMotion": true, "forcedColors": true, "ariaAttributes": true},
  "govCompliance": ["Section 508", "WCAG 2.1 AA", "21st Century IDEA"],
  "variants": ["info", "success", "warning", "error", "slim"],
  "settings": ["$theme-alert-status-color"],
  "relatedComponents": ["site-alert", "banner", "validation"],
  "tokenOverrides": ["$theme-alert-status-color"],
  "tags": ["alert", "slim", "compact", "minimal"]
}
</script>
</head>
<body>
<div class="usa-alert usa-alert--info usa-alert--slim">
  <div class="usa-alert__body">
    <p class="usa-alert__text">Slim informational alert.</p>
  </div>
</div>
</body>
</html>
