<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="USWDS Alert component - error variant for critical problems.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USWDS Alert (Error)</title>
<script type="application/json" id="uswds-agent-meta">
{
  "file": "alert/error.html",
  "title": "Alert (Error)",
  "uswdsComponentType": "alert",
  "uswdsClass": "usa-alert",
  "description": "Error alert for critical problems that need immediate attention or corrective action.",
  "section": "feedback",
  "variant": "error",
  "useWhen": ["Critical errors requiring attention", "Failed operations", "Invalid input errors"],
  "avoidWhen": ["Success messages", "Informational notices", "Slim layouts"],
  "agentPrompt": "Use usa-alert--error class for error variant. Use role='alert' for critical announcements.",
  "editableAreas": ["Error message text", "Heading if present"],
  "preserveElements": ["usa-alert wrapper", "usa-alert--error class", "usa-alert__body", "usa-alert__text", "role='alert'"],
  "knownLimitations": ["role='alert' interrupts screen reader flow"],
  "tier": "curated",
  "requiresJs": "no",
  "interaction": ["passive"],
  "a11y": {"wcag21AA": true, "keyboardNav": false, "screenReader": true, "reducedMotion": true, "forcedColors": true, "ariaAttributes": true},
  "govCompliance": ["Section 508", "WCAG 2.1 AA", "21st Century IDEA"],
  "variants": ["info", "success", "warning", "error", "slim"],
  "settings": ["$theme-alert-status-color"],
  "relatedComponents": ["site-alert", "banner", "validation"],
  "tokenOverrides": ["$theme-alert-status-color"],
  "tags": ["alert", "error", "critical", "red", "failed"]
}
</script>
</head>
<body>
<div class="usa-alert usa-alert--error" role="alert">
  <div class="usa-alert__body">
    <p class="usa-alert__text"><strong>Error:</strong> Please correct the errors below.</p>
  </div>
</div>
</body>
</html>
