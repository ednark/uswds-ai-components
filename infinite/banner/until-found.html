<section class="usa-banner" aria-label="An official website of the United States government">
  <div class="usa-accordion">
    <div class="usa-banner__header" role="banner">
      <div class="usa-banner__inner">
        <div class="grid-col-auto">
          <img aria-hidden="true" class="usa-banner__header-flag" src="favicon-57.png" alt="">
        </div>
        <div class="grid-col-fill tablet:grid-col-auto">
          <p class="usa-banner__header-text">An official website of the United States government</p>
          <p class="usa-banner__header-action usa-banner__header-action-mobile">Here's how you know</p>
        </div>
        <button type="button" class="usa-accordion__button usa-banner__button" aria-expanded="false" aria-controls="gov-banner">
          <span class="usa-banner__button-text">Here's how you know</span>
        </button>
      </div>
    </div>
    <div class="usa-banner__content usa-accordion__content" id="gov-banner" hidden="until-found">
      <div class="grid-row grid-gap-lg">
        <div class="usa-banner__guidance tablet:grid-col-6">
          <div class="usa-media-block__body">
            <p><strong>Official websites use .gov</strong><br>A .gov website belongs to an official government organization in the United States.</p>
          </div>
        </div>
        <div class="usa-banner__guidance tablet:grid-col-6">
          <div class="usa-media-block__body">
            <p><strong>Secure .gov websites use HTTPS</strong><br>A lock or https:// means you've safely connected to the .gov website.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<script>
  document.getElementById('gov-banner').setAttribute('hidden', 'until-found');
</script>
