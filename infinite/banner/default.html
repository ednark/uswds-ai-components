<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="USWDS Banner component identifying official government websites.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USWDS Banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<script type="application/json" id="uswds-agent-meta">{
  "_schemaVersion": 2,
  "discovery": {
    "uswdsComponentType": "banner",
    "uswdsClass": "usa-banner",
    "section": "feedback",
    "variant": "default",
    "requiresJs": "no",
    "interaction": [
      "click",
      "focus"
    ],
    "a11y": {
      "wcag21AA": true,
      "keyboardNav": true,
      "screenReader": true,
      "reducedMotion": true,
      "forcedColors": true,
      "ariaAttributes": true
    },
    "govCompliance": [
      "Section 508",
      "WCAG 2.1 AA",
      "21st Century IDEA",
      "NIST Guidelines"
    ],
    "tier": "curated",
    "tags": [
      "banner",
      "official",
      "government",
      "gov",
      "security",
      "notice",
      "seal",
      "header"
    ],
    "description": "Identifies official government websites and helps users understand security.",
    "compliance": {
      "nistControls": [],
      "fedRampLevel": "IL2+",
      "section508": true,
      "wcag21AA": true,
      "piiHandling": "displays_only",
      "auditTrailCompatible": false,
      "dataMaskingCompatible": false
    },
    "mobileUX": {
      "touchTargetSize": "44px",
      "requiredMinSpacing": "8px",
      "orientationLocked": false,
      "fullscreenSafe": true
    },
    "supportedTokenProfiles": [
      "highContrast"
    ],
    "uswdClass": "usa-banner"
  },
  "selection": {
    "useWhen": [
      "Required on all official government websites",
      "Federal agencies must display this banner",
      "Communicates official status to users",
      "Provides security awareness information"
    ],
    "avoidWhen": [
      "Non-government websites",
      "When hiding official status is desired"
    ]
  },
  "instruction": {
    "agentPrompt": "Update agency name if needed. The banner content is standardized for federal use. USWDS 3 has no usa-banner--slim/--medium (2.x legacy); the banner has one variant plus the <usa-banner> web component for size variants. Ensure the official .gov domain is shown. Render the .gov and lock guidance icons as inline SVG (the sprite is a site asset — do not reference it).",
    "relatedComponents": [
      "site-alert",
      "header",
      "identifier"
    ],
    "variants": [
      "default",
      "medium",
      "slim"
    ],
    "settings": [
      "$theme-banner-font-family"
    ],
    "tokenOverrides": [
      "$theme-banner-font-family",
      "$theme-banner-background-color"
    ]
  },
  "constraints": {
    "preserve": [
      "section.usa-banner wrapper",
      "div.usa-banner__header for condensed view",
      "div.usa-banner__content for expanded content",
      "usa-banner__icon for lock icon",
      "Links to usa.gov and NIST for more info"
    ],
    "editable": [
      "Agency name",
      "Official .gov domain display",
      "Size variant: slim, medium, or default"
    ],
    "limitations": [
      "Required by federal guidelines for government sites",
      "Toggling expanded/collapsed requires JavaScript",
      "Should be first element in body"
    ]
  },
  "file": "banner/default.html",
  "title": "Banner",
  "coordination": {
    "prerequisiteComponents": [],
    "incompatibleWith": [],
    "compositionCost": {
      "costTier": "moderate",
      "estimatedTokens": 1203,
      "renderingTimeMs": 15,
      "recommendedModel": "haiku"
    },
    "agentPromptSequence": [
      "1. Place banner as the very first element in body, above header",
      "2. Keep the expand/collapse JS intact — it is required for the official.gov domain message",
      "3. Do not add content inside the banner beyond the standard copy"
    ],
    "compositionRecipes": [
      "navigation-hierarchy"
    ]
  }
}</script>
<style>
  body {
    font-family: 'Source Sans 3', 'Source Sans Pro', -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0;
    padding: 0;
    background: #f5f5f5;
    color: #1b1b1b;
    line-height: 1.5;
  }
</style>
</head>
<body>
<section class="usa-banner" aria-label="Official website of the United States government">
  <div class="usa-banner__header">
    <p class="usa-banner__header-text">An official website of the United States government</p>
    <p class="usa-banner__header-action" aria-haspopup="dialog">Here's how you know</p>
  </div>
  <div class="usa-banner__content">
    <div class="usa-banner__guidance">
      <img class="usa-banner__icon" src="/assets/img/icon-dot-gov.svg" alt="Dot gov">
      <p class="usa-banner__header-text">
        <strong>Official websites use .gov</strong><br>
        A <strong>.gov</strong> website belongs to an official government organization in the United States.
      </p>
    </div>
    <div class="usa-banner__guidance">
      <img class="usa-banner__icon" src="/assets/img/icon-https.svg" alt="Https">
      <p class="usa-banner__header-text">
        <strong>Secure .gov websites use HTTPS</strong><br>
        A <strong>lock</strong> or <strong>https://</strong> means you've safely connected to the .gov website.
      </p>
    </div>
  </div>
</section>
</body>
</html>
