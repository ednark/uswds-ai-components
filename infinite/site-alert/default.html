<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="USWDS Site Alert component for urgent sitewide information.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USWDS Site Alert</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<script type="application/json" id="uswds-agent-meta">
{
  "file": "site-alert/default.html",
  "title": "Site Alert",
  "uswdsComponentType": "site-alert",
  "uswdsClass": "usa-site-alert",
  "description": "Communicates urgent sitewide information that affects all users.",
  "section": "feedback",
  "variant": "default",
  "useWhen": [
    "Urgent system announcements",
    "Service outages or maintenance windows",
    "Emergency information affecting entire site",
    "Required compliance notices"
  ],
  "avoidWhen": [
    "Non-urgent, page-specific information",
    "Normal operational messages",
    "When alert fatigue is a concern"
  ],
  "agentPrompt": "Add usa-site-alert--emergency for emergency severity. Add usa-site-alert--no-icon to hide icon. Update alert heading and body content. Use role='alert' for critical announcements.",
  "editableAreas": [
    "Site alert heading text",
    "Site alert body content",
    "Severity variant: default, emergency",
    "Icon variant: with icon, no icon"
  ],
  "preserveElements": [
    "div.usa-site-alert wrapper",
    "div.usa-site-alert__body",
    "div.usa-site-alert__heading for title",
    "div.usa-site-alert__text for body",
    "role='alert' for critical alerts"
  ],
  "knownLimitations": [
    "Site alerts are typically in fixed position",
    "Overuse reduces effectiveness",
    "Emergency alerts should be used sparingly"
  ],
  "tier": "curated",
  "requiresJs": "no",
  "interaction": ["passive"],
  "a11y": {"wcag21AA": true, "keyboardNav": false, "screenReader": true, "reducedMotion": true, "forcedColors": true, "ariaAttributes": true},
  "govCompliance": ["Section 508", "WCAG 2.1 AA", "21st Century IDEA", "NIST Guidelines"],
  "variants": ["default", "emergency", "no-icon"],
  "settings": ["$theme-site-alert-border-radius"],
  "relatedComponents": ["alert", "banner", "identifier"],
  "tokenOverrides": ["$theme-site-alert-border-radius", "$theme-site-alert-background-color"],
  "tags": ["site-alert", "alert", "announcement", "emergency", "warning", "system", "outage"]
}
</script>
<style>
  body {
    font-family: 'Source Sans 3', 'Source Sans Pro', -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0;
    padding: 2rem;
    background: #f5f5f5;
    color: #1b1b1b;
    line-height: 1.5;
  }
  .cap {
    position: fixed;
    bottom: 12px;
    left: 16px;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: #717171;
    text-transform: uppercase;
    font-weight: 400;
  }
</style>
</head>
<body>
<div class="usa-site-alert">
  <div class="usa-site-alert__body">
    <h3 class="usa-site-alert__heading">Informational alert</h3>
    <p class="usa-site-alert__text">This is an informational alert that displays sitewide information.</p>
  </div>
</div>
<div class="cap">Site Alert default</div>
</body>
</html>
