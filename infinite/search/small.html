<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="USWDS Search small variant.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USWDS Search (Small)</title>
<script type="application/json" id="uswds-agent-meta">
{
  "file": "search/small.html",
  "title": "Search (Small)",
  "uswdsComponentType": "search",
  "uswdsClass": "usa-search--small",
  "description": "Compact search input for inline or sidebar use.",
  "section": "forms",
  "variant": "small",
  "useWhen": ["Header search", "Sidebar search", "Compact interfaces"],
  "avoidWhen": ["Primary search on homepage", "When search is main feature"],
  "agentPrompt": "Add usa-search--small class to usa-search. Compact inline version.",
  "editableAreas": ["Search placeholder", "Submit button (icon only)"],
  "preserveElements": ["form.usa-search", "input.usa-search__input", "button.usa-search__submit"],
  "knownLimitations": ["Less prominent, may be missed by users"],
  "tier": "curated",
  "requiresJs": "no",
  "interaction": ["focus", "input", "submit"],
  "a11y": {"wcag21AA": true, "keyboardNav": true, "screenReader": true, "reducedMotion": true, "forcedColors": true, "ariaAttributes": true},
  "govCompliance": ["Section 508", "WCAG 2.1 AA", "21st Century IDEA"],
  "variants": ["default", "big", "small"],
  "settings": ["$theme-search-input-width"],
  "relatedComponents": ["text-input", "button"],
  "tokenOverrides": ["$theme-search-input-width"],
  "tags": ["search", "small", "compact", "inline"]
}
</script>
</head>
<body>
<form class="usa-search usa-search--small" role="search">
  <label class="usa-sr-only" for="search-field-small">Search</label>
  <input class="usa-input" type="search" id="search-field-small" name="search" placeholder="Search">
  <button class="usa-button" type="submit">
    <span class="usa-sr-only">Search</span>
  </button>
</form>
</body>
</html>
