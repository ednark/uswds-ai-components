<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="USWDS Sidenav variant using usa-sidenav classes.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USWDS Side Navigation (Sidenav)</title>
<script type="application/json" id="uswds-agent-meta">
{
  "file": "side-navigation/sidenav.html",
  "title": "Side Navigation (Sidenav)",
  "uswdsComponentType": "side-navigation",
  "uswdsClass": "usa-sidenav",
  "description": "USWDS sidenav component for sidebar navigation with nested lists and current page indicator.",
  "section": "navigation",
  "variant": "sidenav",
  "useWhen": ["Sidebar navigation on content pages", "Documentation sites", "Hierarchical page structures"],
  "avoidWhen": ["Top navigation", "Mobile primary nav"],
  "agentPrompt": "Use ul.usa-sidenav with li.usa-sidenav__item. Nest usa-sidenav__sublist for sub-items. Use usa-current for current page.",
  "editableAreas": ["Navigation links", "Current page indicator", "Sub-list items"],
  "preserveElements": ["ul.usa-sidenav", "li.usa-sidenav__item", "ul.usa-sidenav__sublist", "a.usa-current"],
  "knownLimitations": ["Different from usa-nav which is for header navigation"],
  "tier": "curated",
  "requiresJs": "no",
  "interaction": ["click", "focus"],
  "a11y": {"wcag21AA": true, "keyboardNav": true, "screenReader": true, "reducedMotion": true, "forcedColors": true, "ariaAttributes": true},
  "govCompliance": ["Section 508", "WCAG 2.1 AA", "21st Century IDEA"],
  "variants": ["default", "sidenav", "sub-list"],
  "settings": ["$theme-sidenav-font-family"],
  "relatedComponents": ["layout-docs", "breadcrumb", "header"],
  "tokenOverrides": ["$theme-sidenav-font-family"],
  "tags": ["sidenav", "sidebar", "navigation", "hierarchical", "usa-sidenav"]
}
</script>
</head>
<body>
<nav aria-label="Secondary">
  <ul class="usa-sidenav">
    <li class="usa-sidenav__item">
      <a href="#">Parent Section</a>
      <ul class="usa-sidenav__sublist">
        <li class="usa-sidenav__item">
          <a href="#">Sub-item One</a>
        </li>
        <li class="usa-sidenav__item">
          <div class="usa-current">
            <p class="usa-sr-only">current page</p>
            Current Page
          </div>
        </li>
        <li class="usa-sidenav__item">
          <a href="#">Sub-item Three</a>
        </li>
      </ul>
    </li>
  </ul>
</nav>
</body>
</html>
