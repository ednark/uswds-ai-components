<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="USWDS Footer slim variant for minimal footer needs.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USWDS Footer (Slim)</title>
<script type="application/json" id="uswds-agent-meta">
{
  "file": "footer/slim.html",
  "title": "Footer (Slim)",
  "uswdsComponentType": "footer",
  "uswdsClass": "usa-footer usa-footer--slim",
  "description": "Compact footer with minimal content for simple sites.",
  "section": "layout",
  "variant": "slim",
  "useWhen": ["Simple sites with minimal footer needs", "Mobile apps", "When full footer is excessive"],
  "avoidWhen": ["Sites requiring full navigation footer", "Complex agency sites"],
  "agentPrompt": "Add usa-footer--slim class to usa-footer. Removes some sections from default footer.",
  "editableAreas": ["Agency name", "Footer links"],
  "preserveElements": ["footer.usa-footer usa-footer--slim", "div.usa-footer__primary-section"],
  "knownLimitations": ["Limited link capacity"],
  "tier": "curated",
  "requiresJs": "no",
  "interaction": ["click", "focus"],
  "a11y": {"wcag21AA": true, "keyboardNav": true, "screenReader": true, "reducedMotion": true, "forcedColors": true, "ariaAttributes": true},
  "govCompliance": ["Section 508", "WCAG 2.1 AA", "21st Century IDEA"],
  "variants": ["default", "slim", "big"],
  "settings": ["$theme-footer-font-family"],
  "relatedComponents": ["header", "identifier", "link"],
  "tokenOverrides": ["$theme-footer-font-family"],
  "tags": ["footer", "slim", "compact", "minimal"]
}
</script>
</head>
<body>
<footer class="usa-footer usa-footer--slim">
  <div class="usa-footer__primary-section">
    <nav class="usa-footer__nav" aria-label="Footer navigation">
      <ul class="usa-list--unstyled">
        <li class="usa-footer__primary-content">
          <a class="usa-footer__primary-link" href="#">Footer Link</a>
        </li>
      </ul>
    </nav>
  </div>
  <div class="usa-footer__secondary-section">
    <p>Agency Name</p>
  </div>
</footer>
</body>
</html>
