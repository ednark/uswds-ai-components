<style>
  body {
    font-family: 'Source Sans 3', 'Source Sans Pro', -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0;
    padding: 2rem;
    background: #f5f5f5;
    color: #1b1b1b;
    line-height: 1.5;
  }
  .cap {
    position: fixed;
    bottom: 12px;
    left: 16px;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: #717171;
    text-transform: uppercase;
    font-weight: 400;
  }
  .form-section {
    max-width: 400px;
    margin-bottom: 2rem;
  }
</style>
</head>
<body>
<fieldset class="usa-fieldset">
  <legend class="usa-legend">Select your interests</legend>
  <div class="usa-checkbox">
    <input class="usa-checkbox__input" id="check-1" type="checkbox" name="interests" value="design">
    <label class="usa-checkbox__label" for="check-1">Design</label>
  </div>
  <div class="usa-checkbox">
    <input class="usa-checkbox__input" id="check-2" type="checkbox" name="interests" value="development">
    <label class="usa-checkbox__label" for="check-2">Development</label>
  </div>
  <div class="usa-checkbox">
    <input class="usa-checkbox__input" id="check-3" type="checkbox" name="interests" value="research">
    <label class="usa-checkbox__label" for="check-3">Research</label>
  </div>
</fieldset>
<div class="cap">Checkbox default</div>
</body>
</html>
