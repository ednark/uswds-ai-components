<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="USWDS Validation alert variant.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USWDS Validation (Alert)</title>
<script type="application/json" id="uswds-agent-meta">
{
  "file": "validation/alert.html",
  "title": "Validation (Alert)",
  "uswdsComponentType": "validation",
  "uswdsClass": "usa-alert--validation",
  "description": "Validation message styled as an alert for inline errors.",
  "section": "forms",
  "variant": "alert",
  "useWhen": ["Inline form validation errors", "Error messages next to fields", "Multi-error display"],
  "avoidWhen": ["Success messages", "General warnings", "Informational messages"],
  "agentPrompt": "Add usa-alert--validation class to usa-alert. Used with validation-message.",
  "editableAreas": ["Alert body text", "Error descriptions"],
  "preserveElements": ["div.usa-alert usa-alert--validation", "div.usa-alert__body"],
  "knownLimitations": ["Should be used with aria-describedby for screen readers"],
  "tier": "curated",
  "requiresJs": "no",
  "interaction": ["passive"],
  "a11y": {"wcag21AA": true, "keyboardNav": true, "screenReader": true, "reducedMotion": true, "forcedColors": true, "ariaAttributes": true},
  "govCompliance": ["Section 508", "WCAG 2.1 AA", "21st Century IDEA"],
  "variants": ["default", "alert"],
  "settings": [],
  "relatedComponents": ["alert", "summary-box", "text-input"],
  "tokenOverrides": [],
  "tags": ["validation", "alert", "error", "form"]
}
</script>
</head>
<body>
<div class="usa-alert usa-alert--validation" role="alert">
  <div class="usa-alert__body">
    <p class="usa-alert__text">There has been an error with your submission.</p>
  </div>
</div>
</body>
</html>
