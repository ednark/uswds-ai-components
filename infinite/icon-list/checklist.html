<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="USWDS Icon list checklist variant.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USWDS Icon List (Checklist)</title>
<script type="application/json" id="uswds-agent-meta">{
  "_schemaVersion": 2,
  "discovery": {
    "uswdsComponentType": "icon-list",
    "uswdsClass": "usa-icon-list--checklist",
    "section": "data-display",
    "variant": "checklist",
    "requiresJs": "no",
    "interaction": [
      "passive"
    ],
    "a11y": {
      "wcag21AA": true,
      "keyboardNav": true,
      "screenReader": true,
      "reducedMotion": true,
      "forcedColors": true,
      "ariaAttributes": true
    },
    "govCompliance": [
      "Section 508",
      "WCAG 2.1 AA",
      "21st Century IDEA"
    ],
    "tier": "curated",
    "tags": [
      "icon-list",
      "checklist",
      "check",
      "completed"
    ],
    "description": "Icon list with checkmark icons for completed items.",
    "compliance": {
      "nistControls": [],
      "fedRampLevel": "IL2+",
      "section508": true,
      "wcag21AA": true,
      "piiHandling": "displays_only",
      "auditTrailCompatible": false,
      "dataMaskingCompatible": false
    },
    "mobileUX": {
      "touchTargetSize": "44px",
      "requiredMinSpacing": "8px",
      "orientationLocked": false,
      "fullscreenSafe": true
    },
    "supportedTokenProfiles": [
      "highContrast"
    ],
    "uswdClass": "usa-icon-list",
    "limitations": [
      "usa-icon-list--checklist is not a USWDS class; check icons come from the icon hrefs, not a variant class."
    ]
  },
  "selection": {
    "useWhen": [
      "Completed task lists",
      "Requirements checklists",
      "Feature lists with success state"
    ],
    "avoidWhen": [
      "Error states",
      "Neutral lists",
      "When no icons are preferred"
    ]
  },
  "instruction": {
    "agentPrompt": "Add class to usa-icon-list. Uses check icons.",
    "relatedComponents": [
      "list",
      "process-list"
    ],
    "variants": [
      "default",
      "checklist",
      "icon-lg"
    ],
    "settings": [],
    "tokenOverrides": []
  },
  "constraints": {
    "preserve": [
      "ul.usa-icon-list",
      "li.usa-icon-list__item"
    ],
    "editable": [
      "List item text",
      "Icon content"
    ],
    "limitations": []
  },
  "file": "icon-list/checklist.html",
  "title": "Icon List (Checklist)",
  "coordination": {
    "prerequisiteComponents": [],
    "incompatibleWith": [],
    "compositionCost": {
      "costTier": "cheap",
      "estimatedTokens": 715,
      "renderingTimeMs": 15,
      "recommendedModel": "haiku"
    },
    "agentPromptSequence": [
      "1. Keep icon + text pairing; icons need aria-hidden='true' when decorative",
      "2. Pair with USWDS icon sprite or inline SVG"
    ]
  }
}</script>
</head>
<body>
<ul class="usa-icon-list">
  <li class="usa-icon-list__item">
    <div class="usa-icon-list__icon"><svg class="usa-icon" aria-hidden="true" role="img"><use xlink:href="#check"></use></svg></div>
    <div class="usa-icon-list__content">Completed item one</div>
  </li>
  <li class="usa-icon-list__item">
    <div class="usa-icon-list__icon"><svg class="usa-icon" aria-hidden="true" role="img"><use xlink:href="#check"></use></svg></div>
    <div class="usa-icon-list__content">Completed item two</div>
  </li>
</ul>
</body>
</html>
