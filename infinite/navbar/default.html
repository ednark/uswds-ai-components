<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="USWDS Navbar wrapper component for header logo and menu button.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USWDS Navbar</title>
<script type="application/json" id="uswds-agent-meta">{
  "_schemaVersion": 2,
  "discovery": {
    "uswdsComponentType": "navbar",
    "uswdsClass": "usa-navbar",
    "section": "navigation",
    "variant": "default",
    "requiresJs": "required",
    "interaction": [
      "click"
    ],
    "a11y": {
      "wcag21AA": true,
      "keyboardNav": true,
      "screenReader": true,
      "reducedMotion": true,
      "forcedColors": true,
      "ariaAttributes": true
    },
    "govCompliance": [
      "Section 508",
      "WCAG 2.1 AA",
      "21st Century IDEA"
    ],
    "tier": "curated",
    "tags": [
      "navbar",
      "header",
      "logo",
      "menu",
      "mobile"
    ],
    "description": "Navbar wrapper inside header containing logo and mobile menu button.",
    "compliance": {
      "nistControls": [],
      "fedRampLevel": "IL2+",
      "section508": true,
      "wcag21AA": true,
      "piiHandling": "displays_only",
      "auditTrailCompatible": false,
      "dataMaskingCompatible": false
    },
    "mobileUX": {
      "touchTargetSize": "44px",
      "requiredMinSpacing": "8px",
      "orientationLocked": false,
      "fullscreenSafe": true
    },
    "supportedTokenProfiles": [
      "highContrast"
    ],
    "uswdClass": "usa-header"
  },
  "selection": {
    "useWhen": [
      "Header layouts",
      "Logo + menu button combination",
      "Mobile-responsive headers"
    ],
    "avoidWhen": [
      "Standalone use without header"
    ]
  },
  "instruction": {
    "agentPrompt": "Use div.usa-navbar inside usa-header. Contains usa-logo and usa-menu-btn button.",
    "relatedComponents": [
      "header",
      "logo",
      "button"
    ],
    "variants": [
      "default"
    ],
    "settings": [],
    "tokenOverrides": []
  },
  "constraints": {
    "preserve": [
      "div.usa-navbar",
      "div.usa-logo",
      "em.usa-logo-text",
      "button.usa-menu-btn"
    ],
    "editable": [
      "Logo image and text",
      "Menu button label"
    ],
    "limitations": [
      "Only visible on mobile when used with extended header"
    ]
  },
  "file": "navbar/default.html",
  "title": "Navbar",
  "coordination": {
    "prerequisiteComponents": [
      {
        "name": "header",
        "reason": "Navbar extends the header component; nest inside header"
      }
    ],
    "incompatibleWith": [],
    "compositionCost": {
      "costTier": "moderate",
      "estimatedTokens": 700,
      "renderingTimeMs": 60,
      "recommendedModel": "haiku"
    },
    "agentPromptSequence": [
      "1. Fetch header first; navbar lives inside it",
      "2. Keep the mobile menu toggle JS intact"
    ]
  }
}</script>
</head>
<body>
<header class="usa-header usa-header--extended">
  <div class="usa-navbar">
    <div class="usa-logo" id="logo">
      <em class="usa-logo-text">
        <a href="/" title="Home">
          <img src="logo.png" alt="Agency Logo">
        </a>
      </em>
    </div>
    <button class="usa-menu-btn">Menu</button>
  </div>
</header>
</body>
</html>
