<style>
  body {
    font-family: 'Source Sans 3', 'Source Sans Pro', -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0;
    padding: 2rem;
    background: #f5f5f5;
    color: #1b1b1b;
    line-height: 1.5;
  }
  .cap {
    position: fixed;
    bottom: 12px;
    left: 16px;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: #717171;
    text-transform: uppercase;
    font-weight: 400;
  }
  .form-section {
    max-width: 400px;
  }
</style>
</head>
<body>
<fieldset class="usa-fieldset">
  <legend class="usa-legend">Select a delivery method</legend>
  <div class="usa-radio">
    <input class="usa-radio__input" id="delivery-standard" type="radio" name="delivery" value="standard">
    <label class="usa-radio__label" for="delivery-standard">Standard delivery (5-7 days)</label>
  </div>
  <div class="usa-radio">
    <input class="usa-radio__input" id="delivery-express" type="radio" name="delivery" value="express">
    <label class="usa-radio__label" for="delivery-express">Express delivery (2-3 days)</label>
  </div>
  <div class="usa-radio">
    <input class="usa-radio__input" id="delivery-overnight" type="radio" name="delivery" value="overnight">
    <label class="usa-radio__label" for="delivery-overnight">Overnight delivery</label>
  </div>
</fieldset>
<div class="cap">Radio Buttons default</div>
</body>
</html>
