<head>

    "requiresJs": "no",

      "click"

      "ariaAttributes": true

      "WCAG 2.1 AA",
      "21st Century IDEA"

    "tier": "curated",
    "tags": [
      "breadcrumb",
      "wrap",
      "navigation",
      "hierarchy"
    ],
    "description": "Breadcrumb that wraps to multiple lines on narrow screens.",
    "compliance": {
      "nistControls": [],
      "fedRampLevel": "IL2+",
      "section508": true,
      "wcag21AA": true,
      "piiHandling": "displays_only",

    ],

  "selection": {
    "useWhen": [
      "Long breadcrumb trails",
      "Mobile views with limited horizontal space"
    ],
    "avoidWhen": [
      "Single-level breadcrumbs",
      "Wide layouts where inline is better"
    ]
  },
  "instruction": {
    "agentPrompt": "Add usa-breadcrumb--wrap class to usa-breadcrumb. Allows text wrapping.",
    "relatedComponents": [
      "header",
      "link"
    ],
    "variants": [
      "default",
      "wrap",
      "naviprev-next"

    "settings": [],
    "tokenOverrides": []

      "Breadcrumb links and text"
    ],
    "limitations": [

  "file": "breadcrumb/wrap.html",

  "coordination": {
    "prerequisiteComponents": [],
    "incompatibleWith": [],

    "compositionRecipes": [
      "navigation-hierarchy"

<body>
<nav class="usa-breadcrumb usa-breadcrumb--wrap" aria-label="Breadcrumb">
  <ol class="usa-breadcrumb__list">
    <li class="usa-breadcrumb__list-item">
      <a class="usa-breadcrumb__link" href="#">Home</a>
    </li>
    <li class="usa-breadcrumb__list-item">
      <a class="usa-breadcrumb__link" href="#">Section With Long Name</a>
    </li>
    <li class="usa-breadcrumb__list-item">
      <a class="usa-breadcrumb__link" href="#">Subsection With Very Long Name</a>
    </li>
    <li class="usa-breadcrumb__list-item">
      <span>Current Page</span>
    </li>
  </ol>
</nav>
</body>
</html>
