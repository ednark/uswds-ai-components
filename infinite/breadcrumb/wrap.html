<!doctype html>
<html lang="en">
<head>

<title>USWDS Breadcrumb (Wrap)</title>
<script type="application/json" id="uswds-agent-meta">
{
  "file": "breadcrumb/wrap.html",
  "title": "Breadcrumb (Wrap)",
  "uswdsComponentType": "breadcrumb",
  "uswdsClass": "usa-breadcrumb--wrap",
  "description": "Breadcrumb that wraps to multiple lines on narrow screens.",
  "section": "navigation",
  "variant": "wrap",
  "useWhen": ["Long breadcrumb trails", "Mobile views with limited horizontal space"],
  "avoidWhen": ["Single-level breadcrumbs", "Wide layouts where inline is better"],
  "agentPrompt": "Add usa-breadcrumb--wrap class to usa-breadcrumb. Allows text wrapping.",
  "editableAreas": ["Breadcrumb links and text"],
  "preserveElements": ["nav.usa-breadcrumb", "ol.usa-breadcrumb__list", "li.usa-breadcrumb__list-item"],
  "knownLimitations": ["Wrapped text may be harder to scan visually"],
  "tier": "curated",
  "requiresJs": "no",
  "interaction": ["click"],
  "a11y": {"wcag21AA": true, "keyboardNav": true, "screenReader": true, "reducedMotion": true, "forcedColors": true, "ariaAttributes": true},
  "govCompliance": ["Section 508", "WCAG 2.1 AA", "21st Century IDEA"],
  "variants": ["default", "wrap", "naviprev-next"],
  "settings": [],
  "relatedComponents": ["header", "link"],
  "tokenOverrides": [],

}
</script>
</head>
<body>
<nav class="usa-breadcrumb usa-breadcrumb--wrap" aria-label="Breadcrumb">
  <ol class="usa-breadcrumb__list">
    <li class="usa-breadcrumb__list-item">
      <a class="usa-breadcrumb__link" href="#">Home</a>
    </li>
    <li class="usa-breadcrumb__list-item">
      <a class="usa-breadcrumb__link" href="#">Section With Long Name</a>
    </li>
    <li class="usa-breadcrumb__list-item">
      <a class="usa-breadcrumb__link" href="#">Subsection With Very Long Name</a>
    </li>
    <li class="usa-breadcrumb__list-item">
      <span>Current Page</span>
    </li>
  </ol>
</nav>
</body>
</html>
