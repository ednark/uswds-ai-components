<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="USWDS Breadcrumb component for showing user's location within site hierarchy.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USWDS Breadcrumb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<script type="application/json" id="uswds-agent-meta">
{
  "file": "breadcrumb/default.html",
  "title": "Breadcrumb",
  "uswdsComponentType": "breadcrumb",
  "uswdsClass": "usa-breadcrumb",
  "description": "Secondary navigation showing user's location within the site hierarchy.",
  "section": "navigation",
  "variant": "default",
  "useWhen": [
    "Users need to understand where they are in a multi-level website",
    "Deep site hierarchies where users need to backtrack",
    "Content organized in a clear hierarchy (3+ levels)",
    "E-commerce, documentation, or organizational sites"
  ],
  "avoidWhen": [
    "Shallow sites with only 1-2 levels",
    "Mobile interfaces where space is extremely limited",
    "When breadcrumbs would be longer than the main content"
  ],
  "agentPrompt": "Add aria-label='Breadcrumb' to the nav element. Change list items to match actual page hierarchy. Update href values to point to correct parent pages. Add usa-breadcrumb--wrap for wrapping long breadcrumbs or usa-breadcrumb--naviprev-next for previous/next navigation.",
  "editableAreas": [
    "Breadcrumb link text and href values",
    "Current page text (should not be a link)",
    "aria-label on the nav element",
    "Variant: usa-breadcrumb--wrap or usa-breadcrumb--naviprev-next"
  ],
  "preserveElements": [
    "nav.usa-breadcrumb wrapper with aria-label",
    "ol.usa-breadcrumb__list for the trail",
    "li.usa-breadcrumb__item for each level",
    "Current page: span inside li (not a link) with aria-current='page'",
    "usa-breadcrumb__link class on anchor elements"
  ],
  "knownLimitations": [
    "Current page should never be a link — use span with aria-current",
    "First item should typically be 'Home' linking to root",
    "Long breadcrumb trails can wrap awkwardly on mobile"
  ],
  "tier": "curated",
  "requiresJs": "optional",
  "interaction": ["click", "focus"],
  "a11y": {"wcag21AA": true, "keyboardNav": true, "screenReader": true, "reducedMotion": true, "forcedColors": true, "ariaAttributes": true},
  "govCompliance": ["Section 508", "WCAG 2.1 AA", "21st Century IDEA"],
  "variants": ["default", "wrap", "naviprev-next"],
  "settings": ["$theme-breadcrumb-font-family"],
  "relatedComponents": ["pagination", "side-navigation", "step-indicator"],
  "tokenOverrides": ["$theme-breadcrumb-font-family", "$theme-breadcrumb-background-color"],
  "tags": ["breadcrumb", "navigation", "path", "hierarchy", "secondary-nav"]
}
</script>
<style>
  body {
    font-family: 'Source Sans 3', 'Source Sans Pro', -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0;
    padding: 2rem;
    background: #f5f5f5;
    color: #1b1b1b;
    line-height: 1.5;
  }
  .cap {
    position: fixed;
    bottom: 12px;
    left: 16px;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: #717171;
    text-transform: uppercase;
    font-weight: 400;
  }
</style>
</head>
<body>
<nav aria-label="Breadcrumb">
  <ol class="usa-breadcrumb__list">
    <li class="usa-breadcrumb__list-item">
      <a href="#" class="usa-breadcrumb__link">Home</a>
    </li>
    <li class="usa-breadcrumb__list-item">
      <a href="#" class="usa-breadcrumb__link">Federal Agencies</a>
    </li>
    <li class="usa-breadcrumb__list-item">
      <a href="#" class="usa-breadcrumb__link">U.S. Web Design System</a>
    </li>
    <li class="usa-breadcrumb__list-item">
      <span aria-current="page">Components</span>
    </li>
  </ol>
</nav>
<div class="cap">Breadcrumb default</div>
</body>
</html>
