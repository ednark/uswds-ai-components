<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="USWDS Tag component for labeling or categorizing content.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USWDS Tag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<script type="application/json" id="uswds-agent-meta">
{
  "file": "tag/default.html",
  "title": "Tag",
  "uswdsComponentType": "tag",
  "uswdsClass": "usa-tag",
  "description": "Draws attention to new or categorized content elements.",
  "section": "feedback",
  "variant": "default",
  "useWhen": [
    "Labeling new or updated content",
    "Categorizing items with status labels",
    "Adding metadata to content items",
    "Filtering or faceted navigation labels"
  ],
  "avoidWhen": [
    "As primary action buttons",
    "When they add noise rather than value",
    "Overcrowding interfaces with too many tags"
  ],
  "agentPrompt": "Use usa-tag--big for larger tags. Update tag text content. Add role='list' and individual tags as list items when multiple tags are used. Use semantic colors appropriately.",
  "editableAreas": [
    "Tag text content",
    "Size variant: usa-tag or usa-tag--big",
    "Color (use semantic variants in custom CSS)",
    "Interactive tags: add href or role='link'"
  ],
  "preserveElements": [
    "span.usa-tag for the tag element",
    "usa-tag--big for larger variant",
    "Close button with usa-tag__close for removable tags",
    "role='list' when used as list of tags"
  ],
  "knownLimitations": [
    "Tags are not interactive by default",
    "Removable tags require JavaScript",
    "Color customization requires CSS customization"
  ],
  "tier": "curated",
  "requiresJs": "no",
  "interaction": ["passive", "focus"],
  "a11y": {"wcag21AA": true, "keyboardNav": false, "screenReader": true, "reducedMotion": true, "forcedColors": true, "ariaAttributes": false},
  "govCompliance": ["Section 508", "WCAG 2.1 AA", "21st Century IDEA"],
  "variants": ["default", "big"],
  "settings": ["$theme-tag-border-radius"],
  "relatedComponents": ["alert", "card", "list"],
  "tokenOverrides": ["$theme-tag-border-radius", "$theme-tag-text-color", "$theme-tag-background-color"],
  "tags": ["tag", "label", "badge", "status", "category", "marker", "new", "updated"]
}
</script>
<style>
  body {
    font-family: 'Source Sans 3', 'Source Sans Pro', -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0;
    padding: 2rem;
    background: #f5f5f5;
    color: #1b1b1b;
    line-height: 1.5;
  }
  .cap {
    position: fixed;
    bottom: 12px;
    left: 16px;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: #717171;
    text-transform: uppercase;
    font-weight: 400;
  }
  .tag-demo {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
</style>
</head>
<body>
<div class="tag-demo">
  <span class="usa-tag">Tag</span>
  <span class="usa-tag">New</span>
  <span class="usa-tag usa-tag--big">Big Tag</span>
</div>
<div class="cap">Tag default</div>
</body>
</html>
