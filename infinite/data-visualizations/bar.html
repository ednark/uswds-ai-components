  "uswdsComponentType": "data-visualizations",
  "uswdsClass": "usa-chart-data",

  "section": "data-display",
  "variant": "bar",
  "useWhen": ["Comparing categories", "Showing distributions", "Dashboard metrics"],
  "avoidWhen": ["Time series data", "Part-to-whole relationships"],

  "settings": [],

</head>
<body>
<figure class="usa-chart-container">
  <canvas id="barChart" role="img" aria-label="Bar chart showing sample data"></canvas>
  <ul class="usa-legend">
    <li><span class="usa-legend__color" style="background: #005ea2;"></span> Category A</li>
    <li><span class="usa-legend__color" style="background: #71767a;"></span> Category B</li>
    <li><span class="usa-legend__color" style="background: #00a91c;"></span> Category C</li>
  </ul>
</figure>
