<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="USWDS Card component for content and actions about a single subject.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USWDS Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<script type="application/json" id="uswds-agent-meta">{
  "_schemaVersion": 2,
  "discovery": {
    "uswdsComponentType": "card",
    "uswdsClass": "usa-card",
    "section": "data-display",
    "variant": "default",
    "requiresJs": "no",
    "interaction": [
      "passive",
      "click"
    ],
    "a11y": {
      "wcag21AA": true,
      "keyboardNav": true,
      "screenReader": true,
      "reducedMotion": true,
      "forcedColors": true,
      "ariaAttributes": true
    },
    "govCompliance": [
      "Section 508",
      "WCAG 2.1 AA",
      "21st Century IDEA"
    ],
    "tier": "curated",
    "tags": [
      "card",
      "container",
      "content",
      "article",
      "grid",
      "display"
    ],
    "description": "Container for content and actions about a single subject.",
    "compliance": {
      "nistControls": [],
      "fedRampLevel": "IL2+",
      "section508": true,
      "wcag21AA": true,
      "piiHandling": "displays_only",
      "auditTrailCompatible": false,
      "dataMaskingCompatible": false
    },
    "mobileUX": {
      "touchTargetSize": "44px",
      "requiredMinSpacing": "8px",
      "orientationLocked": false,
      "fullscreenSafe": true
    },
    "supportedTokenProfiles": [
      "highContrast"
    ],
    "uswdClass": "usa-card"
  },
  "selection": {
    "useWhen": [
      "Grouping related content about a single topic",
      "Displaying discrete items in a grid or list layout",
      "When content needs a visible container with clear boundaries",
      "Articles, products, or service offerings"
    ],
    "avoidWhen": [
      "Single column layouts where cards add unnecessary complexity",
      "Dense data tables where cards would waste space",
      "When semantic HTML sections or articles are more appropriate"
    ]
  },
  "instruction": {
    "agentPrompt": "Add usa-card--flag for horizontal layout, usa-card__media for the image area, usa-card__media--inset for inset media, usa-card--header-flag for header image variant. Update heading level to match page hierarchy. Icon treatments in cards are site customizations — pair card media/flag variants with site icon assets.",
    "relatedComponents": [
      "collection",
      "table"
    ],
    "variants": [
      "default",
      "flag",
      "media",
      "inset",
      "header-flag"
    ],
    "settings": [
      "$theme-card-border-radius",
      "$theme-card-gap"
    ],
    "tokenOverrides": [
      "$theme-card-border-radius",
      "$theme-card-gap"
    ]
  },
  "constraints": {
    "preserve": [
      "article.usa-card container",
      "div.usa-card__header for card heading area",
      "div.usa-card__body for main content",
      "div.usa-card__footer for actions if present",
      "Heading uses usa-card__heading class"
    ],
    "editable": [
      "Card heading text and heading level (h2-h6)",
      "Card body content and media",
      "Card footer actions (buttons, links)",
      "Image src and alt text for media variants"
    ],
    "limitations": [
      "Cards are not responsive by default — use CSS Grid or Flexbox for responsive layouts",
      "Flag variant requires specific DOM order (image first in header)",
      "Media variant image must be in the header"
    ]
  },
  "file": "card/default.html",
  "title": "Card",
  "coordination": {
    "prerequisiteComponents": [],
    "incompatibleWith": [],
    "compositionCost": {
      "costTier": "moderate",
      "estimatedTokens": 1184,
      "renderingTimeMs": 15,
      "recommendedModel": "haiku"
    },
    "agentPromptSequence": [
      "1. Cards work in grid layouts — pair with layout utilities for columns",
      "2. Keep the header/body/media block structure; do not flatten",
      "3. One primary action per card; the whole card may link if content is single-purpose"
    ]
  }
}</script>
<style>
  body {
    font-family: 'Source Sans 3', 'Source Sans Pro', -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0;
    padding: 2rem;
    background: #f5f5f5;
    color: #1b1b1b;
    line-height: 1.5;
  }
  .card-grid {
    display: grid;
    gap: 1.5rem;
    max-width: 1200px;
  }
  .cap {
    position: fixed;
    bottom: 12px;
    left: 16px;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: #717171;
    text-transform: uppercase;
    font-weight: 400;
  }
</style>
</head>
<body>
<div class="card-grid">
  <article class="usa-card">
    <div class="usa-card__header">
      <h2 class="usa-card__heading">Card Heading</h2>
    </div>
    <div class="usa-card__body">
      <p>Card body content goes here. This is where the main content of the card lives.</p>
    </div>
    <div class="usa-card__footer">
      <button class="usa-button" type="button">Action</button>
    </div>
  </article>
</div>
<div class="cap">Card default</div>
</body>
</html>
