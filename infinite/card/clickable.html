<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="USWDS Card clickable variant where entire card is a link.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USWDS Card (Clickable)</title>
<script type="application/json" id="uswds-agent-meta">{
  "_schemaVersion": 2,
  "discovery": {
    "uswdsComponentType": "card",
    "uswdsClass": "usa-card",
    "section": "data-display",
    "variant": "clickable",
    "requiresJs": "no",
    "interaction": [
      "click",
      "hover",
      "focus"
    ],
    "a11y": {
      "wcag21AA": true,
      "keyboardNav": true,
      "screenReader": true,
      "reducedMotion": true,
      "forcedColors": true,
      "ariaAttributes": true
    },
    "govCompliance": [
      "Section 508",
      "WCAG 2.1 AA",
      "21st Century IDEA"
    ],
    "tier": "curated",
    "tags": [
      "card",
      "clickable",
      "link",
      "navigation",
      "stretched-link"
    ],
    "description": "Card variant where the entire card container is clickable as a single link.",
    "compliance": {
      "nistControls": [],
      "fedRampLevel": "IL2+",
      "section508": true,
      "wcag21AA": true,
      "piiHandling": "displays_only",
      "auditTrailCompatible": false,
      "dataMaskingCompatible": false
    },
    "mobileUX": {
      "touchTargetSize": "44px",
      "requiredMinSpacing": "8px",
      "orientationLocked": false,
      "fullscreenSafe": true
    },
    "supportedTokenProfiles": [
      "highContrast"
    ],
    "uswdClass": "usa-card"
  },
  "selection": {
    "useWhen": [
      "Topic cards on landing pages",
      "Navigation cards",
      "When entire card should be clickable"
    ],
    "avoidWhen": [
      "Cards with multiple actions",
      "Cards with non-link content only"
    ]
  },
  "instruction": {
    "agentPrompt": "Keep one link per card: the heading wraps the only <a>. The tile's .demo-stretch-link pattern CSS (style block) stretches that link over the card — copy the CSS with the markup. Never invent usa-* classes for this (make-link and card-link were invented and are removed).",
    "relatedComponents": [
      "collection",
      "link"
    ],
    "variants": [
      "default",
      "flag",
      "media",
      "inset",
      "header-flag",
      "group",
      "clickable"
    ],
    "settings": [
      "$theme-card-border-radius",
      "$theme-card-gap"
    ],
    "tokenOverrides": [
      "$theme-card-border-radius",
      "$theme-card-gap"
    ]
  },
  "constraints": {
    "preserve": [
      "li.usa-card > div.usa-card__container",
      "div.usa-card__header with h2.usa-card__heading link",
      "div.usa-card__body",
      ".demo-stretch-link pattern CSS (copy with the markup)"
    ],
    "editable": [
      "Card heading",
      "Card body text",
      "Link href",
      "Card image"
    ],
    "limitations": [
      "Entire card is one link - can't have multiple actions",
      ".demo-stretch-link is a pattern helper defined in this tile's style block, not a USWDS class — copy its CSS with the markup"
    ]
  },
  "file": "card/clickable.html",
  "title": "Card (Clickable)",
  "coordination": {
    "prerequisiteComponents": [],
    "incompatibleWith": [],
    "compositionCost": {
      "costTier": "cheap",
      "estimatedTokens": 926,
      "renderingTimeMs": 15,
      "recommendedModel": "haiku"
    },
    "agentPromptSequence": [
      "1. Cards work in grid layouts — pair with layout utilities for columns",
      "2. Keep the header/body/media block structure; do not flatten",
      "3. One primary action per card; the whole card may link if content is single-purpose"
    ]
  }
}</script>
<style>
  /* Pattern helper (NOT a USWDS class): stretches the heading link over the
     whole card. usa-card__container is position: relative in USWDS, so the
     ::after overlay covers the card. Copy these rules with the markup. */
  .demo-stretch-link::after {
    content: "";
    position: absolute;
    inset: 0;
  }
</style>
</head>
<body>
<ul class="usa-card-group">
  <li class="usa-card desktop:grid-col-4">
    <div class="usa-card__container">
      <div class="usa-card__media">
        <div class="usa-card__img" style="background: linear-gradient(135deg, #667eea, #764ba2); height: 150px;"></div>
      </div>
      <div class="usa-card__header">
        <h2 class="usa-card__heading">
          <a href="/topic-one" class="demo-stretch-link">Clickable Card Heading</a>
        </h2>
      </div>
      <div class="usa-card__body">
        <p>The entire card is clickable. The heading link stretches over the card so the whole surface is one link.</p>
      </div>
    </div>
  </li>
</ul>
</body>
</html>
