<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="USWDS Card media variant with large image.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USWDS Card (Media)</title>
<script type="application/json" id="uswds-agent-meta">
{
  "file": "card/media.html",
  "title": "Card (Media)",
  "uswdsComponentType": "card",
  "uswdsClass": "usa-card usa-card--media",
  "description": "Card with large image positioned at top of card.",
  "section": "data-display",
  "variant": "media",
  "useWhen": ["Image-heavy content", "Photo articles", "Visual-first cards"],
  "avoidWhen": ["Text-only content", "Mobile where large images take too much space"],
  "agentPrompt": "Add usa-card--media class to usa-card. Image goes in usa-card__media container at top.",
  "editableAreas": ["Card heading and body text", "Image src and alt", "Footer actions"],
  "preserveElements": ["article.usa-card usa-card--media", "div.usa-card__media", "div.usa-card__body"],
  "knownLimitations": ["Image at top, takes significant vertical space"],
  "tier": "curated",
  "requiresJs": "no",
  "interaction": ["passive", "click"],
  "a11y": {"wcag21AA": true, "keyboardNav": true, "screenReader": true, "reducedMotion": true, "forcedColors": true, "ariaAttributes": true},
  "govCompliance": ["Section 508", "WCAG 2.1 AA", "21st Century IDEA"],
  "variants": ["default", "flag", "media", "inset", "header-flag"],
  "settings": ["$theme-card-border-radius", "$theme-card-gap"],
  "relatedComponents": ["collection", "table"],
  "tokenOverrides": ["$theme-card-border-radius", "$theme-card-gap"],
  "tags": ["card", "media", "image", "photo"]
}
</script>
</head>
<body>
<article class="usa-card usa-card--media">
  <div class="usa-card__media">
    <div class="usa-card__img" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 150px;"></div>
  </div>
  <div class="usa-card__header">
    <h2 class="usa-card__heading">Media Card Heading</h2>
  </div>
  <div class="usa-card__body">
    <p>Card body content with large image at top.</p>
  </div>
</article>
</body>
</html>
