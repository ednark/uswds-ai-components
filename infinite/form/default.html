<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="USWDS Form component for entering and submitting information.">
<meta name="viewport" content="width=device-width, initial-scale=1">

      "forcedColors": true,
      "ariaAttributes": true
    },
    "govCompliance": [
      "Section 508",
      "WCAG 2.1 AA",
      "21st Century IDEA"
    ],
    "tier": "curated",
    "tags": [
      "form",
      "input",
      "submit",
      "registration",
      "search",
      "contact"
    ],
    "description": "Allows users to enter information into a page for processing and submission.",
    "compliance": {
      "nistControls": [
        "AU-12"
      ],
      "fedRampLevel": "IL2+",
      "section508": true,
      "wcag21AA": true,
      "piiHandling": "accepts_input",

    "avoidWhen": [
      "Display-only interfaces",
      "Single actions that don't need input"
    ]
  },
  "instruction": {
    "agentPrompt": "Add usa-form--large for bigger inputs. Update action and method attributes for form submission. Add autocomplete attributes for browser autofill. Group related fields with fieldset/legend. Include proper error handling markup.",

      "text-input",
      "checkbox",
      "radio-buttons",

      "character-count"

    "variants": [

    "settings": [
      "$theme-form-font-family"
    ],
    "tokenOverrides": [
      "$theme-form-font-family",
      "$theme-input-border-radius"
    ]
  },
  "constraints": {
    "preserve": [
      "form.usa-form wrapper",
      "label.usa-label for all inputs",
      "input.usa-input with proper type and id",
      "span.usa-hint for helper text",
      "legend and fieldset for grouped inputs"

    "editable": [
      "Form action URL",
      "Form method (GET or POST)",
      "Field labels and input types",
      "autocomplete attribute values for better UX",
      "Required field indicators"

    "limitations": [

  "title": "Form",
  "coordination": {

      "renderingTimeMs": 35,
      "recommendedModel": "haiku"

      "1. Use this form element as the root container for a group of inputs",

      "login-flow"

<style>
  body {
    font-family: 'Source Sans 3', 'Source Sans Pro', -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0;
    padding: 2rem;
    background: #f5f5f5;
    color: #1b1b1b;
    line-height: 1.5;
  }
  .cap {
    position: fixed;
    bottom: 12px;
    left: 16px;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: #717171;
    text-transform: uppercase;
    font-weight: 400;
  }
  .form-demo {
    max-width: 400px;
  }
</style>
</head>
<body>
<form class="usa-form">
  <fieldset class="usa-fieldset">
    <legend class="usa-legend">Contact Information</legend>
    <div class="usa-form-group">
      <label class="usa-label" for="full-name">Full Name</label>
      <input class="usa-input" id="full-name" name="full-name" type="text" autocomplete="name" required>
    </div>
    <div class="usa-form-group">
      <label class="usa-label" for="email">Email Address</label>
      <input class="usa-input" id="email" name="email" type="email" autocomplete="email" required>
    </div>
    <button class="usa-button" type="submit">Submit</button>
  </fieldset>
</form>
<div class="cap">Form default</div>
</body>
</html>
