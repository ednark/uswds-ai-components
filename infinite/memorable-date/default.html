<style>

.usa-fieldset{border:0;padding:0;margin:0 0 1.5rem}
.usa-legend{font-weight:400;margin:0 0 .5rem;max-width:30rem}
.usa-hint{color:#71767a;margin:0 0 .75rem}
.usa-memorable-date{display:flex;gap:1rem;flex-wrap:wrap}
.usa-memorable-date [class*=--month]{width:8rem}
.usa-memorable-date [class*=--day]{width:5rem}
.usa-memorable-date [class*=--year]{width:7rem}
.usa-label{display:block;margin-bottom:.35rem}
.usa-input{font:inherit;display:block;width:100%;padding:.5rem .6rem;border:1px solid #565c65;border-radius:0;box-sizing:border-box;color:#1b1b1b;background:#fff}

<body>
<div class="preview-section">
  <fieldset class="usa-fieldset">
    <legend class="usa-legend">Date of birth</legend>
    <span id="dob-hint" class="usa-hint">For example, January 28 1986</span>
    <div class="usa-memorable-date">
      <div class="usa-form-group usa-form-group--month">
        <label class="usa-label" for="dob-month">Month</label>
        <input class="usa-input" aria-describedby="dob-hint" id="dob-month" name="dob_month" type="number" min="1" max="12" inputmode="numeric" autocomplete="bday-month">
      </div>
      <div class="usa-form-group usa-form-group--day">
        <label class="usa-label" for="dob-day">Day</label>
        <input class="usa-input" aria-describedby="dob-hint" id="dob-day" name="dob_day" type="number" min="1" max="31" inputmode="numeric" autocomplete="bday-day">
      </div>
      <div class="usa-form-group usa-form-group--year">
        <label class="usa-label" for="dob-year">Year</label>
        <input class="usa-input" aria-describedby="dob-hint" id="dob-year" name="dob_year" type="number" min="1900" max="2026" inputmode="numeric" autocomplete="bday-year">
      </div>
    </div>
  </fieldset>
</div>
<div class="cap">memorable-date default</div>
</body>
