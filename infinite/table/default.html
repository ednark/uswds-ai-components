<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="USWDS Table component for displaying data in columns and rows.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USWDS Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<script type="application/json" id="uswds-agent-meta">
{
  "file": "table/default.html",
  "title": "Table",
  "uswdsComponentType": "table",
  "uswdsClass": "usa-table",
  "description": "Displays information in columns and rows for easy scanning and comparison.",
  "section": "data-display",
  "variant": "default",
  "useWhen": [
    "Comparing data across multiple items",
    "Showing structured numerical or text data",
    "When users need to scan for specific values",
    "Data that benefits from column sorting"
  ],
  "avoidWhen": [
    "Single items or simple lists (use card or list)",
    "Highly visual content (use imagery instead)",
    "Complex hierarchical data (consider nested lists)",
    "Mobile-heavy interfaces where tables don't fit"
  ],
  "agentPrompt": "Add usa-table--borderless, usa-table--striped, usa-table--scrollable, or usa-table--stacked for variants. Update header scope to 'col' for column headers. Add sortable functionality with data-sortable.",
  "editableAreas": [
    "Header cell content and scope",
    "Data cell values",
    "Caption text for accessibility",
    "Variant: borderless, striped, scrollable, stacked"
  ],
  "preserveElements": [
    "table.usa-table wrapper",
    "caption for table description",
    "thead for header section",
    "th scope='col' for column headers",
    "tbody for data rows",
    "tr for each row"
  ],
  "knownLimitations": [
    "Scrollable variant needs JS for proper horizontal scroll",
    "Stacked variant stacks cells vertically on mobile",
    "Tables need caption or aria-label for accessibility"
  ],
  "tier": "curated",
  "requiresJs": "no",
  "interaction": ["passive", "focus"],
  "a11y": {"wcag21AA": true, "keyboardNav": true, "screenReader": true, "reducedMotion": true, "forcedColors": true, "ariaAttributes": false},
  "govCompliance": ["Section 508", "WCAG 2.1 AA", "21st Century IDEA"],
  "variants": ["default", "borderless", "striped", "scrollable", "stacked"],
  "settings": ["$theme-table-border-radius"],
  "relatedComponents": ["card", "data-visualizations"],
  "tokenOverrides": ["$theme-table-border-color", "$theme-table-text-color"],
  "tags": ["table", "data", "grid", "rows", "columns", "spreadsheet", "list"]
}
</script>
<style>
  body {
    font-family: 'Source Sans 3', 'Source Sans Pro', -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0;
    padding: 2rem;
    background: #f5f5f5;
    color: #1b1b1b;
    line-height: 1.5;
  }
  .cap {
    position: fixed;
    bottom: 12px;
    left: 16px;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: #717171;
    text-transform: uppercase;
    font-weight: 400;
  }
</style>
</head>
<body>
<table class="usa-table">
  <caption>Component accessibility status</caption>
  <thead>
    <tr>
      <th scope="col">Component</th>
      <th scope="col">WCAG 2.1 AA</th>
      <th scope="col">Section 508</th>
      <th scope="col">Keyboard Nav</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>Accordion</td>
      <td>Pass</td>
      <td>Pass</td>
      <td>Yes</td>
    </tr>
    <tr>
      <td>Alert</td>
      <td>Pass</td>
      <td>Pass</td>
      <td>N/A</td>
    </tr>
    <tr>
      <td>Button</td>
      <td>Pass</td>
      <td>Pass</td>
      <td>Yes</td>
    </tr>
  </tbody>
</table>
<div class="cap">Table default</div>
</body>
</html>
