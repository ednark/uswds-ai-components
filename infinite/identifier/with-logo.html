<!doctype html>

<title>USWDS Identifier (With Logo)</title>
<script type="application/json" id="uswds-agent-meta">

  "title": "Identifier (With Logo)",
  "uswdsComponentType": "identifier",

  "description": "Identifier component including agency logo.",
  "section": "supporting",
  "variant": "with-logo",
  "useWhen": ["Federal agency websites", "Required for government compliance", "Parent agency identification"],

  "knownLimitations": ["Required on federal government websites"],

  "settings": [],
  "relatedComponents": ["footer", "banner"],
  "tokenOverrides": [],

</head>
<body>
<section class="usa-identifier" aria-labelledby="identifier-heading">
  <h2 class="usa-identifier__heading" id="identifier-heading">Agency Identifier</h2>
  <div class="usa-identifier__logos">
    <a href="#" class="usa-identifier__logo">
      <img src="https://designsystem.digital.gov/img/logo-img.png" alt="Agency Logo">

  </div>
  <div class="usa-identifier__identity">
    <p>An official website of [Agency Name]</p>
