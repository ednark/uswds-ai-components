<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="USWDS Identifier component for agency branding and required legal links.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USWDS Identifier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<script type="application/json" id="uswds-agent-meta">{
  "_schemaVersion": 2,
  "discovery": {
    "uswdsComponentType": "identifier",
    "uswdsClass": "usa-identifier",
    "section": "data-display",
    "variant": "default",
    "requiresJs": "no",
    "interaction": [
      "passive",
      "focus"
    ],
    "a11y": {
      "wcag21AA": true,
      "keyboardNav": false,
      "screenReader": true,
      "reducedMotion": true,
      "forcedColors": true,
      "ariaAttributes": false
    },
    "govCompliance": [
      "Section 508",
      "WCAG 2.1 AA",
      "21st Century IDEA",
      "NIST Guidelines"
    ],
    "tier": "curated",
    "tags": [
      "identifier",
      "agency",
      "legal",
      "footer",
      "federal",
      "compliance",
      "branding"
    ],
    "description": "Communicates a site's parent agency and displays required agency links per federal law.",
    "compliance": {
      "nistControls": [],
      "fedRampLevel": "IL2+",
      "section508": true,
      "wcag21AA": true,
      "piiHandling": "displays_only",
      "auditTrailCompatible": false,
      "dataMaskingCompatible": false
    },
    "mobileUX": {
      "touchTargetSize": "44px",
      "requiredMinSpacing": "8px",
      "orientationLocked": false,
      "fullscreenSafe": true
    },
    "supportedTokenProfiles": [
      "highContrast"
    ],
    "uswdClass": "usa-identifier"
  },
  "selection": {
    "useWhen": [
      "Federal government websites requiring agency identification",
      "Pages needing to display parent agency information",
      "Compliance with 21st Century IDEA requirements",
      "Sites requiring specific legal and accessibility links"
    ],
    "avoidWhen": [
      "Non-government websites",
      "Internal-only applications"
    ]
  },
  "instruction": {
    "agentPrompt": "Update agency name, parent agency, and links. Required links are Accessibility, Privacy/Security, and FOIA at minimum — Terms of Service is not a federal requirement. Update the USA.gov block for the correct government portal.",
    "relatedComponents": [
      "footer",
      "link"
    ],
    "variants": [
      "default"
    ],
    "settings": [
      "$theme-identifier-font-family"
    ],
    "tokenOverrides": [
      "$theme-identifier-font-family"
    ]
  },
  "constraints": {
    "preserve": [
      "div.usa-identifier with section.usa-identifier__section--masthead",
      "div.usa-identifier__identity-domain",
      "ul.usa-identifier__required-links-list with li.usa-identifier__required-links-item"
    ],
    "editable": [
      "Agency name",
      "Parent agency name",
      "All link text and URLs",
      "Logo and masthead if applicable",
      "Copyright year"
    ],
    "limitations": [
      "Federal websites are required to display identifier per federal guidelines",
      "Links must point to actual agency pages, not placeholders",
      "USA.gov link is required for federal sites",
      "Required links are Accessibility, Privacy/Security, and FOIA — Terms of Service is not a federal requirement and was removed from this tile"
    ]
  },
  "file": "identifier/default.html",
  "title": "Identifier",
  "coordination": {
    "prerequisiteComponents": [],
    "incompatibleWith": [],
    "compositionCost": {
      "costTier": "moderate",
      "estimatedTokens": 1069,
      "renderingTimeMs": 15,
      "recommendedModel": "haiku"
    },
    "agentPromptSequence": [
      "1. Place identifier directly below the footer",
      "2. Keep the required agency links and logo slots intact"
    ],
    "compositionRecipes": [
      "navigation-hierarchy"
    ]
  }
}</script>
<style>
  body {
    font-family: 'Source Sans 3', 'Source Sans Pro', -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0;
    padding: 0;
    background: #f5f5f5;
    color: #1b1b1b;
    line-height: 1.5;
  }
</style>
</head>
<body>
<div class="usa-identifier">
  <section class="usa-identifier__section usa-identifier__section--masthead" aria-label="Agency identifier">
    <div class="usa-identifier__container">
      <section class="usa-identifier__identity" aria-label="Agency description">
        <p class="usa-identifier__identity-domain">Agency.gov</p>
        <p class="usa-identifier__identity-disclaimer">
          <span aria-hidden="true">An official website of the</span>
          <a href="https://www.agency.gov/">U.S. Agency Name</a>
        </p>
      </section>
    </div>
  </section>
  <nav class="usa-identifier__section usa-identifier__section--required-links" aria-label="Important links">
    <div class="usa-identifier__container">
      <ul class="usa-identifier__required-links-list">
        <li class="usa-identifier__required-links-item">
          <a href="/accessibility" class="usa-identifier__required-link usa-link">Accessibility</a>
        </li>
        <li class="usa-identifier__required-links-item">
          <a href="/privacy" class="usa-identifier__required-link usa-link">Privacy and security policies</a>
        </li>
        <li class="usa-identifier__required-links-item">
          <a href="/foia" class="usa-identifier__required-link usa-link">FOIA requests</a>
        </li>
      </ul>
    </div>
  </nav>
  <section class="usa-identifier__section usa-identifier__section--usagov" aria-label="U.S. government information and services">
    <div class="usa-identifier__container">
      <div class="usa-identifier__usagov-description">Looking for U.S. government information and services?</div>
      <a href="https://www.usa.gov/" class="usa-link">Visit USA.gov</a>
    </div>
  </section>
</div>
</body>
</html>
