<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="USWDS Identifier component for agency branding and required legal links.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USWDS Identifier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<script type="application/json" id="uswds-agent-meta">
{
  "file": "identifier/default.html",
  "title": "Identifier",
  "uswdsComponentType": "identifier",
  "uswdsClass": "usa-identifier",
  "description": "Communicates a site's parent agency and displays required agency links per federal law.",
  "section": "data-display",
  "variant": "default",
  "useWhen": [
    "Federal government websites requiring agency identification",
    "Pages needing to display parent agency information",
    "Compliance with 21st Century IDEA requirements",
    "Sites requiring specific legal and accessibility links"
  ],
  "avoidWhen": [
    "Non-government websites",
    "Internal-only applications"
  ],
  "agentPrompt": "Update agency name, parent agency, and links. Ensure all required links are present: Privacy Policy, Terms of Service, Accessibility, Contact. Update USA.gov link for correct government portal.",
  "editableAreas": [
    "Agency name",
    "Parent agency name",
    "All link text and URLs",
    "Logo and masthead if applicable",
    "Copyright year"
  ],
  "preserveElements": [
    "section.usa-identifier wrapper",
    "div.usa-identifier__masthead",
    "div.usa-identifier__agency-name",
    "div.usa-identifier__links for required links",
    "Required link: Privacy Policy, Terms of Service, Accessibility"
  ],
  "knownLimitations": [
    "Federal websites are required to display identifier per federal guidelines",
    "Links must point to actual agency pages, not placeholders",
    "USA.gov link is required for federal sites"
  ],
  "tier": "curated",
  "requiresJs": "no",
  "interaction": ["passive", "focus"],
  "a11y": {"wcag21AA": true, "keyboardNav": false, "screenReader": true, "reducedMotion": true, "forcedColors": true, "ariaAttributes": false},
  "govCompliance": ["Section 508", "WCAG 2.1 AA", "21st Century IDEA", "NIST Guidelines"],
  "variants": ["default"],
  "settings": ["$theme-identifier-font-family"],
  "relatedComponents": ["footer", "link"],
  "tokenOverrides": ["$theme-identifier-font-family"],
  "tags": ["identifier", "agency", "legal", "footer", "federal", "compliance", "branding"]
}
</script>
<style>
  body {
    font-family: 'Source Sans 3', 'Source Sans Pro', -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0;
    padding: 0;
    background: #f5f5f5;
    color: #1b1b1b;
    line-height: 1.5;
  }
</style>
</head>
<body>
<section class="usa-identifier">
  <div class="usa-identifier__container">
    <div class="usa-identifier__masthead">
      <div class="usa-identifier__agency-name">General Services Administration</div>
    </div>
    <div class="usa-identifier__links">
      <a href="#">Privacy Policy</a>
      <a href="#">Terms of Service</a>
      <a href="#">Accessibility</a>
      <a href="#">Contact</a>
    </div>
    <p>Looking for U.S. government information and services? <a href="https://www.usa.gov/" target="_blank" rel="noopener">Visit USA.gov</a></p>
  </div>
</section>
</body>
</html>
