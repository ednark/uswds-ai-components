<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="USWDS Logo with image and text combination.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USWDS Logo (Image + Text)</title>

      "screenReader": true,

      "ariaAttributes": true

    "govCompliance": [
      "Section 508",
      "WCAG 2.1 AA",
      "21st Century IDEA"

    "tier": "curated",
    "tags": [
      "logo",
      "image",
      "text",
      "tagline",

      "agency"

      "wcag21AA": true,

<body>
<div class="usa-logo" id="logo">
  <em class="usa-logo__text">
    <a class="logo-img" href="/" title="Home" aria-label="Home">
      <img src="logo.svg" alt="Agency Logo">
      <div class="logo-text">
        <strong class="logo-text-bold">Agency Name</strong>
        <div class="logo-tagline">Making government services easier to find</div>
      </div>
    </a>
  </em>
</div>
</body>
</html>
