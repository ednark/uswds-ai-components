<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="USWDS Character Count component showing remaining text allowed.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USWDS Character Count</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<script type="application/json" id="uswds-agent-meta">
{
  "file": "character-count/default.html",
  "title": "Character Count",
  "uswdsComponentType": "character-count",
  "uswdsClass": "usa-character-count",
  "description": "Shows users how much text they can enter when there's a character limit.",
  "section": "forms",
  "variant": "default",
  "useWhen": [
    "Text fields with character limits",
    "Bio or description fields with limited space",
    "Social media-style input fields",
    "Compliance or regulatory text limits"
  ],
  "avoidWhen": [
    "Fields without limits",
    "Short text fields where limits are obvious",
    "Rich text editors with separate limits"
  ],
  "agentPrompt": "Set maxlength attribute on textarea for character limit. Add data-maxlength with same value. Update aria-describedby on input to reference character count element.",
  "editableAreas": [
    "Character limit value (maxlength and data-maxlength)",
    "Input or textarea element",
    "Character count message text"
  ],
  "preserveElements": [
    "div.usa-character-count with data-maxlength",
    "textarea.usa-textarea with maxlength",
    "div.usa-character-count__status for remaining count",
    "aria-describedby linking input to status"
  ],
  "knownLimitations": [
    "JavaScript updates the displayed count automatically",
    "maxlength prevents exceeding the limit",
    "Warning styling triggers at 90% of limit"
  ],
  "tier": "curated",
  "requiresJs": "required",
  "interaction": ["input", "focus"],
  "a11y": {"wcag21AA": true, "keyboardNav": true, "screenReader": true, "reducedMotion": true, "forcedColors": true, "ariaAttributes": true},
  "govCompliance": ["Section 508", "WCAG 2.1 AA", "21st Century IDEA"],
  "variants": ["default", "error"],
  "settings": ["$theme-input-border-radius"],
  "relatedComponents": ["text-input", "form", "validation"],
  "tokenOverrides": ["$theme-input-border-radius"],
  "tags": ["character", "count", "limit", "length", "text", "textarea", "remaining"]
}
</script>
<style>
  body {
    font-family: 'Source Sans 3', 'Source Sans Pro', -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0;
    padding: 2rem;
    background: #f5f5f5;
    color: #1b1b1b;
    line-height: 1.5;
  }
  .cap {
    position: fixed;
    bottom: 12px;
    left: 16px;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: #717171;
    text-transform: uppercase;
    font-weight: 400;
  }
  .form-section {
    max-width: 400px;
  }
</style>
</head>
<body>
<div class="form-section">
  <div class="usa-character-count" data-maxlength="150">
    <label class="usa-label" for="with-hint">Description</label>
    <span class="usa-hint" id="with-hint-hint">150 characters allowed</span>
    <textarea class="usa-textarea" id="with-hint" aria-describedby="with-hint-hint" maxlength="150"></textarea>
    <div class="usa-character-count__status" aria-hidden="true">
      <span class="usa-character-count__count">150</span> characters remaining
    </div>
  </div>
</div>
<div class="cap">Character Count default</div>
</body>
</html>
