<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="USWDS Layout Docs for documentation pages with sidenav.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USWDS Layout Docs</title>
<script type="application/json" id="uswds-agent-meta">
{
  "file": "layout-docs/default.html",
  "title": "Layout Docs",
  "uswdsComponentType": "layout-docs",
  "uswdsClass": "usa-layout-docs",
  "description": "Documentation layout with sidebar navigation and main content area.",
  "section": "layout",
  "variant": "default",
  "useWhen": ["Documentation pages", "Content with sidebar navigation", "Article pages with table of contents"],
  "avoidWhen": ["Full-width content", "Landing pages", "App-like interfaces"],
  "agentPrompt": "Use usa-layout-docs on main element. Add usa-layout-docs__sidenav for sidebar and usa-layout-docs__main for content.",
  "editableAreas": ["Sidenav content", "Main content"],
  "preserveElements": ["main.usa-layout-docs", "aside.usa-layout-docs__sidenav", "div.usa-layout-docs__main"],
  "knownLimitations": ["Requires grid system for proper layout"],
  "tier": "curated",
  "requiresJs": "no",
  "interaction": ["passive", "click"],
  "a11y": {"wcag21AA": true, "keyboardNav": true, "screenReader": true, "reducedMotion": true, "forcedColors": true, "ariaAttributes": true},
  "govCompliance": ["Section 508", "WCAG 2.1 AA", "21st Century IDEA"],
  "variants": ["default"],
  "settings": [],
  "relatedComponents": ["side-navigation", "breadcrumb", "prose"],
  "tokenOverrides": [],
  "tags": ["layout", "docs", "sidenav", "documentation", "sidebar"]
}
</script>
</head>
<body>
<main class="usa-layout-docs usa-section" id="main-content">
  <div class="grid-container">
    <div class="grid-row grid-gap">
      <aside class="usa-layout-docs__sidenav desktop:grid-col-4">
        <nav aria-label="Secondary">
          <ul class="usa-sidenav">
            <li class="usa-sidenav__item"><a href="#">Section One</a></li>
            <li class="usa-sidenav__item"><a href="#" class="usa-current">Current Page</a></li>
            <li class="usa-sidenav__item"><a href="#">Section Three</a></li>
          </ul>
        </nav>
      </aside>
      <div class="usa-layout-docs__main usa-prose desktop:grid-col-8">
        <h1>Page Title</h1>
        <p>Main content goes here.</p>
      </div>
    </div>
  </div>
</main>
</body>
</html>
